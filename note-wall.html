<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>你的留言牆</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Klee+One:wght@400;600&family=Long+Cang&family=LXGW+WenKai+TC:wght@400;700&family=Patrick+Hand&display=swap');
      /* Design reminder: 「靜靜長出的紙牆」— warm paper, quiet space, inner-old / outer-new rings. */
      :root {
        --ink: #322a26;
        --soft-ink: #6d625b;
        --wall: #f5f0e8;
        --peach: #eca782;
        --butter: #f4d66e;
        --sage: #a9c8b4;
        --sky: #a9c6d7;
        --lilac: #c5b7d9;
        --rose: #e6a5ab;
        --paper-shadow: 0 13px 19px rgba(77, 64, 54, 0.18), 0 2px 4px rgba(77, 64, 54, 0.1);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      }

      * { box-sizing: border-box; }
      html { background: var(--wall); }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Noto Sans TC", "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: var(--wall);
        background-image:
          radial-gradient(circle at 15% 4%, rgba(255,255,255,.88), transparent 26%),
          repeating-linear-gradient(93deg, rgba(103,83,66,.018) 0, rgba(103,83,66,.018) 1px, transparent 1px, transparent 15px),
          linear-gradient(140deg, rgba(255,255,255,.9), rgba(249,240,230,.7));
        background-size: auto, auto, cover;
        background-attachment: fixed;
      }
      button, textarea, input { font: inherit; }
      button { color: inherit; }
      button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid #a06545; outline-offset: 3px; }

      .app-shell { min-height: 100vh; padding: 16px clamp(14px, 3vw, 42px) 34px; overflow: hidden; }
      .topbar {
        max-width: 1480px; margin: 0 auto 13px; min-height: 54px; display: flex; align-items: center; justify-content: space-between;
        gap: 12px; padding: 8px 6px; border-bottom: 1px solid rgba(62, 48, 39, .13);
      }
      .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .brand-mark {
        width: 39px; height: 39px; flex: 0 0 auto; position: relative; display: block; border: 1.8px solid var(--ink); border-radius: 2px;
        background: var(--peach); transform: rotate(-4deg); box-shadow: 3px 3px 0 rgba(50, 42, 38, .12);
      }
      .brand-mark::before { content: ""; position: absolute; width: 30px; height: 30px; background: var(--butter); border: 1.5px solid var(--ink); left: 6px; top: 6px; z-index: -1; transform: rotate(9deg); }
      .brand-mark::after { content: ""; position: absolute; width: 31px; height: 20px; left: -9px; top: 14px; border: 1.5px solid var(--ink); border-right: 0; border-radius: 50% 0 0 50%; transform: rotate(-22deg); }
      .brand-copy { min-width: 0; }
      .brand-title { font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(18px, 2.3vw, 25px); letter-spacing: .03em; line-height: 1.05; }
      .brand-note { margin-top: 3px; color: var(--soft-ink); font-size: 11px; letter-spacing: .08em; }
      .top-actions { display: flex; align-items: center; gap: 7px; }
      .text-button, .icon-button {
        border: 1px solid rgba(50, 42, 38, .24); border-radius: 999px; background: rgba(255,255,255,.42); min-height: 34px;
        padding: 0 12px; cursor: pointer; transition: transform 160ms var(--ease-out), background 160ms var(--ease-out);
      }
      .text-button:hover, .icon-button:hover { background: rgba(255,255,255,.8); transform: translateY(-1px); }
      .text-button:active, .icon-button:active { transform: scale(.97); }
      .icon-button { width: 34px; padding: 0; display: grid; place-items: center; font-family: Georgia, serif; font-size: 17px; }

      .compose-strip { max-width: 1480px; margin: 0 auto 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: stretch; gap: 11px; }
      .compose-card { position:relative; padding: 13px 18px 11px 21px; background-color: rgba(255,252,244,.86); background-image: repeating-linear-gradient(0deg, transparent 0, transparent 25px, rgba(97,77,60,.065) 26px); border: 0; border-left: 3px solid rgba(236,167,130,.75); border-radius: 1px; box-shadow: 4px 6px 0 rgba(64, 49, 39, .055), 0 7px 13px rgba(87, 72, 61, .065); transform: rotate(-.1deg); }
      .compose-card::after { content:""; position:absolute; width:54px; height:12px; right:9%; top:-5px; background:rgba(235,205,157,.57); transform:rotate(1.5deg); box-shadow:0 1px 1px rgba(73,57,44,.05); }
      .compose-label { display: flex; justify-content: space-between; gap: 12px; color: var(--soft-ink); font-size: 12px; margin-bottom: 5px; }
      #memoInput { width: 100%; height: 38px; resize: none; border: 0; background: transparent; color: var(--ink); font-size: 15px; line-height: 1.45; }
      #memoInput::placeholder { color: #938880; }
      .memo-actions { display: flex; align-items: center; gap: 7px; padding-top: 5px; }
      .author-input { max-width: 134px; border: 0; border-bottom: 1px solid rgba(50,42,38,.24); background: transparent; padding: 3px 1px; font-size: 12px; color: var(--soft-ink); }
      .author-input::placeholder { color: #9e938b; }
      .post-button { border: 0; background: var(--peach); color: var(--ink); padding: 8px 14px; min-width: 84px; align-self: end; border-radius: 1px; cursor: pointer; font-family:"LXGW WenKai TC", "Klee One", cursive; box-shadow: 2px 3px 0 rgba(50,42,38,.1); transform:rotate(.5deg); transition: transform 160ms var(--ease-out), background 160ms var(--ease-out), box-shadow 160ms var(--ease-out); }
      .post-button:hover { background: #f0b08f; box-shadow:3px 5px 0 rgba(50,42,38,.11); transform: translateY(-2px) rotate(-.3deg); }
      .post-button:active { transform: scale(.97); }

      .wall-frame { max-width: 1480px; margin: 0 auto; position: relative; }
      .wall {
        position: relative; min-height: 940px; overflow: hidden; isolation: isolate; border: 0;
        background-color: #f8f4ed;
        background-image:
          radial-gradient(circle at 25% 18%, rgba(255,255,255,.92), transparent 34%),
          radial-gradient(circle at 78% 75%, rgba(232,209,184,.22), transparent 29%),
          repeating-linear-gradient(88deg, rgba(76,60,47,.024) 0, rgba(76,60,47,.024) 1px, transparent 1px, transparent 18px),
          linear-gradient(100deg, rgba(255,255,255,.48), rgba(239,226,210,.3));
        background-size: auto, auto, auto, auto;
        box-shadow: inset 0 0 0 7px rgba(255,255,255,.28), 0 16px 31px rgba(80, 66, 56, .09);
      }
      .board-surface { position:absolute; inset:0; transform-origin:0 0; will-change:transform; }
      .wall::before { content: ""; position: absolute; inset: 0; opacity: .33; pointer-events: none; background: repeating-linear-gradient(0deg, transparent 0, transparent 31px, rgba(54,43,36,.025) 32px); }
      .wall::after { content: ""; position: absolute; width: 290px; height: 290px; left: 50%; top: 50%; transform: translate(-50%,-50%); border: 1px solid rgba(73,60,49,.07); border-radius: 50%; pointer-events: none; }
      .wall-caption { position: absolute; left: 21px; bottom: 16px; color: rgba(67,55,47,.52); font-size: 11px; letter-spacing: .08em; z-index: 2; }
      .wall-hint { position: absolute; right: 19px; bottom: 16px; color: rgba(67,55,47,.52); font-size: 11px; z-index: 2; }
      .mobile-board-tools { display:none; }

      .note {
        --note-bg: var(--butter); --rotation: 0deg; --width: 168px;
        position: absolute; width: var(--width); min-height: 105px; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%);
        z-index: var(--z, 3); padding: 18px 16px 13px; overflow: hidden; background: var(--note-bg); color: #2f2824; box-shadow: var(--paper-shadow);
        transform: translate(-50%, -50%) rotate(var(--rotation)); cursor: grab; user-select: none; touch-action: none;
        transition: box-shadow 180ms var(--ease-out), filter 180ms var(--ease-out), opacity 240ms var(--ease-out), transform 220ms var(--ease-out);
      }
      .note::before { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(69,54,42,.08); pointer-events: none; }
      .note:hover { filter: saturate(1.05); box-shadow: 0 18px 26px rgba(75,60,49,.23), 0 2px 4px rgba(75,60,49,.1); }
      .note.dragging { cursor: grabbing; transition: none; filter: saturate(1.08); box-shadow: 0 26px 34px rgba(52,42,34,.28); }
      .note.floating { animation: noteFloat var(--float-time, 5.8s) var(--float-delay, 0s) ease-in-out infinite; }
      .note.dragging.floating { animation: none; }
      .note.enter { animation: paperIn 260ms var(--ease-out) both; }
      .note.personal { --note-bg: var(--rose); }
      .note.intro { --note-bg: #f1b9a9; }
      .note.drawing-only { min-height: 104px; display: grid; place-items: center; padding: 10px; }
      .note-content { position: relative; z-index: 1; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--note-ink, #2f2824); font-family: var(--note-font, "Kaiti TC", "STKaiti", "KaiTi", "BiauKai", serif); font-size: var(--note-size, clamp(16px, 1.65vw, 21px)); font-weight: var(--note-weight, 500); font-style: var(--note-style, normal); line-height: var(--note-line, 1.43); letter-spacing: var(--note-track, .018em); }
      .note.short .note-content { font-size: var(--note-size, clamp(20px, 2vw, 28px)); line-height: var(--note-line, 1.25); }
      .note-signature { position: relative; z-index: 1; margin-top: 11px; text-align: right; color: var(--note-ink, rgba(47,40,36,.71)); opacity: .77; font-family: var(--note-font, "Kaiti TC", "STKaiti", "KaiTi", serif); font-size: 12px; }
      .note-knot { position: absolute; width: 7px; height: 7px; background: rgba(69,54,42,.23); border-radius: 50%; top: 7px; right: 8px; }
      .note.reply-near::after { content: ""; position: absolute; width: 12px; height: 12px; left: -8px; bottom: -8px; border-left: 1px solid rgba(58,47,39,.37); border-bottom: 1px solid rgba(58,47,39,.37); border-radius: 0 0 0 12px; }
      .note.paper-1 { width:calc(var(--width) + 9px); min-height:112px; border-radius:0 0 9px 0; background-image:linear-gradient(135deg,rgba(255,255,255,.13),transparent 36%); }
      .note.paper-2 { width:calc(var(--width) - 10px); min-height:115px; border-radius:0 0 0 8px; outline:1px solid rgba(82,63,48,.06); outline-offset:-4px; }
      .note.paper-3 { min-height:110px; background-image:linear-gradient(180deg,rgba(255,255,255,.18),transparent 26%); }
      .note.paper-1 .note-knot { width:9px; height:9px; background:rgba(69,54,42,.18); }
      .note.paper-2 .note-knot { top:8px; right:11px; width:6px; height:6px; background:rgba(155,81,70,.34); }
      .note.paper-3 .note-knot { border-radius:1px; transform:rotate(17deg); background:rgba(69,54,42,.2); }
      .hand-bold { --note-font: "LXGW WenKai TC", "Kalam", cursive; --note-size: clamp(17px, 1.8vw, 23px); --note-weight: 700; --note-line: 1.34; --note-track: -.045em; --note-ink: #2d2927; }
      .hand-round { --note-font: "LXGW WenKai TC", "Klee One", cursive; --note-size: clamp(16px, 1.66vw, 21px); --note-weight: 400; --note-line: 1.49; --note-track: .006em; --note-ink: #43352f; }
      .hand-fine { --note-font: "LXGW WenKai TC", "Caveat", cursive; --note-size: clamp(15px, 1.55vw, 20px); --note-weight: 400; --note-line: 1.56; --note-track: .025em; --note-ink: #463d38; }
      .hand-blue { --note-font: "LXGW WenKai TC", "Kalam", cursive; --note-size: clamp(16px, 1.64vw, 21px); --note-weight: 700; --note-line: 1.43; --note-track: -.015em; --note-ink: #274e67; }
      .hand-purple { --note-font: "LXGW WenKai TC", "Long Cang", cursive; --note-size: clamp(18px, 1.84vw, 24px); --note-weight: 400; --note-line: 1.36; --note-track: .004em; --note-ink: #4a3e68; }
      .hand-child { --note-font: "LXGW WenKai TC", "Patrick Hand", cursive; --note-size: clamp(17px, 1.78vw, 23px); --note-weight: 700; --note-line: 1.31; --note-track: -.018em; --note-ink: #9a4f37; }
      .hand-penciled { --note-font: "LXGW WenKai TC", "Caveat", cursive; --note-size: clamp(15px, 1.52vw, 20px); --note-weight: 400; --note-style: italic; --note-line: 1.53; --note-track: .02em; --note-ink: #61554c; }
      .hand-quick { --note-font: "LXGW WenKai TC", "Kalam", cursive; --note-size: clamp(16px, 1.66vw, 22px); --note-weight: 400; --note-line: 1.38; --note-track: -.018em; --note-ink: #402f2c; }
      .hand-tall { --note-font: "LXGW WenKai TC", "Long Cang", cursive; --note-size: clamp(19px, 1.92vw, 25px); --note-weight: 400; --note-line: 1.25; --note-track: .012em; --note-ink: #2d2927; }
      .info-note { --note-font: "LXGW WenKai TC", "Klee One", cursive; --note-size: clamp(13px, 1.32vw, 17px); --note-line: 1.42; --note-ink: #3c332e; }
      .doodle { width: 72px; height: 72px; position: relative; z-index: 1; overflow: visible; }
      .note.has-doodle .doodle.corner { width: 38px; height: 38px; position: absolute; right: 9px; bottom: 8px; opacity: .8; overflow: hidden; }
      .note.has-doodle .doodle.corner > svg { width: 100%; height: 100%; display: block; }
      .note.drawing-only .doodle > svg { width: 100%; height: 100%; display: block; }
      .note.has-doodle .note-content { padding-right: 23px; }
      .doodle path, .doodle line, .doodle circle, .doodle ellipse, .doodle polyline { fill: none; stroke: #4f423a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .doodle .accent { stroke: #c87959; }

      .modal-layer { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(54,44,37,.18); backdrop-filter: blur(8px); }
      .modal-layer.open { display: flex; }
      .modal-paper { width: min(560px, 93vw); min-height: 310px; position: relative; padding: clamp(30px, 6vw, 55px); box-shadow: 0 28px 70px rgba(35,29,25,.32); transform: rotate(-.6deg); }
      .modal-paper::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(55,43,35,.1); pointer-events: none; }
      .modal-close { position: absolute; top: 13px; right: 14px; border: 0; background: transparent; font-size: 23px; cursor: pointer; z-index: 2; }
      .modal-kind { position: relative; color: rgba(47,40,36,.62); letter-spacing: .08em; font-size: 11px; margin-bottom: 16px; }
      .modal-content { position: relative; min-height: 130px; white-space: pre-wrap; color:var(--note-ink,#2f2824); font-family:var(--note-font,"Kaiti TC",serif); font-size: clamp(24px, 4vw, 33px); font-weight:var(--note-weight,500); font-style:var(--note-style,normal); letter-spacing:var(--note-track,.01em); line-height: var(--note-line,1.42); }
      .modal-edit { width: 100%; min-height: 150px; border: 0; resize: vertical; background: transparent; color: var(--note-ink,var(--ink)); font-family:var(--note-font,"Kaiti TC",serif); font-size: clamp(23px, 4vw, 32px); font-weight:var(--note-weight,500); font-style:var(--note-style,normal); letter-spacing:var(--note-track,.01em); line-height: var(--note-line,1.4); }
      .modal-author { display: block; margin: 9px 0 14px auto; max-width: 190px; border: 0; border-bottom: 1px solid rgba(50,42,38,.3); background: transparent; text-align: right; color:var(--note-ink,#2f2824); font-family:var(--note-font,"Kaiti TC",serif); font-size: 15px; }
      .modal-actions { position: relative; display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 19px; }
      .paper-action { border: 1px solid rgba(47,40,36,.55); background: rgba(255,255,255,.34); padding: 7px 10px; border-radius: 2px; cursor: pointer; font-size: 12px; }
      .paper-action.danger { border-color: #9c504b; color: #7b3631; }
      .paper-action.primary { background: rgba(47,40,36,.88); color: white; }

      .info-panel { position: fixed; z-index: 60; top: 72px; right: clamp(12px, 3vw, 42px); width: min(370px, calc(100vw - 24px)); display: none; padding: 19px; background: #fffdf8; border: 1px solid rgba(50,42,38,.2); box-shadow: 0 20px 50px rgba(54,43,34,.21); }
      .info-panel.open { display: block; }
      .info-panel h2 { margin: 0 0 9px; font-family: Georgia, "Noto Serif TC", serif; font-size: 20px; }
      .info-panel p { margin: 0 0 12px; color: #625850; font-size: 13px; line-height: 1.65; }
      .privacy-line { padding: 10px; margin: 12px 0; background: #f6f0e8; font-size: 12px !important; color: #4f463f !important; }
      .clear-button { border: 0; border-bottom: 1px solid #9c504b; padding: 2px 0; background: transparent; color: #853e39; cursor: pointer; font-size: 12px; }
      .style-panel { position: fixed; z-index: 60; top: 72px; right: clamp(12px, 3vw, 42px); width: min(310px, calc(100vw - 24px)); display: none; padding: 18px; background: #fffdf8; border: 1px solid rgba(50,42,38,.2); box-shadow: 0 20px 50px rgba(54,43,34,.21); }
      .style-panel.open { display: block; }
      .style-panel h2 { margin: 0 0 12px; font-family: Georgia, "Noto Serif TC", serif; font-size: 19px; }
      .style-panel p { margin: 0 0 8px; color: #6b5e55; font-size: 12px; }
      .hand-choices, .ink-choices { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 15px; }
      .hand-choice { min-width:64px; border:1px solid rgba(50,42,38,.25); background:#fff; padding:6px 8px; cursor:pointer; font-size:13px; }
      .hand-choice.selected { border-color:var(--peach); box-shadow: inset 0 -3px 0 var(--peach); }
      .ink-choice { width:27px; height:27px; border:2px solid #fff; border-radius:50%; box-shadow:0 0 0 1px rgba(50,42,38,.28); cursor:pointer; }
      .ink-choice.selected { transform:scale(1.15); box-shadow:0 0 0 2px var(--peach); }
      .crisis { max-width: 1480px; margin: 0 auto 12px; display: none; padding: 13px 15px; border-left: 4px solid #a85d52; background: rgba(255,246,242,.94); color: #523b36; font-size: 14px; line-height: 1.58; }
      .crisis.show { display: block; }

      @keyframes paperIn { from { opacity: 0; transform: translate(-50%, -50%) rotate(calc(var(--rotation) - 4deg)) scale(.95); } to { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rotation)) scale(1); } }
      @keyframes noteFloat { 0%, 100% { translate: 0 0; } 48% { translate: 0 -2px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; } }
      @media (max-width: 720px) {
        .app-shell { padding: 0 0 14px; }
        .topbar { min-height:0; display:flex; justify-content:flex-start; margin:0; padding:12px 16px 8px; border:0; }
        .topbar .top-actions { display:none; }
        .brand { gap:8px; }
        .brand-mark { width:30px; height:30px; border-width:1.4px; box-shadow:2px 2px 0 rgba(50,42,38,.1); }
        .brand-mark::before { width:23px; height:23px; left:5px; top:5px; border-width:1px; }
        .brand-mark::after { width:24px; height:16px; left:-7px; top:11px; border-width:1px; }
        .brand-title { font-size:20px; }
        .brand-note { font-size:9px; margin-top:2px; }
        .compose-strip { grid-template-columns:minmax(0,1fr) 75px; gap:8px; margin:0 11px 9px; }
        .compose-card { min-height:99px; padding:10px 13px 9px 16px; box-shadow:0 4px 12px rgba(68,53,41,.075); }
        .compose-card::after { width:39px; height:9px; top:-4px; }
        .compose-label { font-size:10px; margin-bottom:3px; }
        #memoInput { height:45px; font-size:14px; }
        .author-input { font-size:11px; }
        .post-button { width:auto; min-width:0; min-height:0; align-self:stretch; padding:8px 5px; font-size:15px; line-height:1.15; box-shadow:2px 3px 0 rgba(50,42,38,.1); }
        .wall-frame { width:100%; }
        .wall { min-height:calc(100svh - 218px); height:calc(100svh - 218px); overflow:hidden; touch-action:none; box-shadow:none; }
        .board-surface { width:960px; height:1240px; inset:0 auto auto 0; }
        .note { min-height:105px; padding:16px 14px 12px; left:calc(var(--mx) * 1%); top:calc(var(--my) * 1%); }
        .note.has-doodle .doodle.corner { width: 31px; height: 31px; right: 7px; bottom: 6px; }
        .note-content { font-size: var(--note-size, 18px); }
        .note.short .note-content { font-size: var(--note-size, 21px); }
        .wall-caption { left: 11px; bottom: 10px; }
        .wall-hint { display: none; }
        .mobile-board-tools { position:absolute; z-index:20; right:13px; bottom:17px; display:flex; flex-direction:column; gap:7px; padding:7px; border:1px solid rgba(61,49,40,.14); border-radius:15px; background:rgba(255,253,248,.88); box-shadow:0 12px 26px rgba(55,43,35,.16); backdrop-filter:blur(10px); }
        .mobile-board-tools button { width:38px; height:38px; border:0; border-radius:10px; background:transparent; color:#41352f; font-size:20px; cursor:pointer; }
        .mobile-board-tools button:active { background:#f0b08f; transform:scale(.94); }
        .mobile-board-tools .mobile-divider { height:1px; margin:0 4px; background:rgba(61,49,40,.12); }
        .mobile-zoom-readout { display:grid; place-items:center; min-height:22px; color:#74665d; font-size:10px; font-family:"LXGW WenKai TC",cursive; }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="你的留言牆">
          <span class="brand-mark" aria-hidden="true"></span>

        }
        function openNote(id){
          const note=state.notes.find(n=>n.id===id); if(!note) return; selectedId=id; const c=COPY[state.lang]; const layer=$('#modalLayer'); const paper=$('#modalPaper');
          paper.style.background=note.color; paper.className='modal-paper '+(note.hand||'hand-bold'); paper.style.setProperty('--note-ink',note.ink||'#2f2824'); $('#modalKind').textContent=note.type==='personal'?c.personal:(note.type==='info'?c.memo:c.passerby);
          const body=$('#modalBody'); const actions=$('#modalActions'); actions.innerHTML='';
          if(note.type==='personal'){
            body.innerHTML='<textarea class="modal-edit" id="modalEdit">'+escapeHtml(note.content)+'</textarea><input class="modal-author" id="modalAuthor" value="'+escapeHtml(note.author||'')+'" placeholder="'+escapeHtml(c.author)+'" />';
            actions.innerHTML='<button class="paper-action danger" id="removeNote">'+c.remove+'</button><button class="paper-action primary" id="saveNote">'+c.save+'</button>';
            $('#saveNote').onclick=()=>{note.content=$('#modalEdit').value.trim()||note.content;note.author=$('#modalAuthor').value.trim();saveState();closeModal();render();scheduleResponse(note);};
          } else {
            body.innerHTML=note.drawingOnly?'<div style="display:grid;place-items:center;min-height:155px">'+doodle(note.doodle)+'</div>':'<div class="modal-content">'+escapeHtml(note.content).replace(/\n/g,'<br>')+'</div>';
            actions.innerHTML='<button class="paper-action danger" id="removeNote">'+c.remove+'</button><button class="paper-action" id="replyNote">'+c.reply+'</button><button class="paper-action primary" id="keepNote">'+c.keep+'</button>';
            $('#replyNote').onclick=()=>{memoInput.value=c.leaveReply+'\n';closeModal();memoInput.focus();}; $('#keepNote').onclick=closeModal;
          }
          $('#removeNote').onclick=()=>{state.notes=state.notes.filter(n=>n.id!==id);saveState();closeModal();render();};
          layer.classList.add('open');
        }
        function closeModal(){ $('#modalLayer').classList.remove('open'); selectedId=null; }
        function applyCopy(){
          const c=COPY[state.lang]; document.documentElement.lang=state.lang==='zh'?'zh-Hant':'en'; $('#brandTitle').textContent=c.title; $('#brandNote').textContent=c.tag; $('#composeLabel').textContent=c.compose; $('#memoryLabel').textContent=c.memory; memoInput.placeholder=c.placeholder; authorInput.placeholder=c.author; $('#postButton').textContent=c.post; $('#wallCaption').textContent=c.wall; $('#wallHint').textContent=c.hint; $('#infoTitle').textContent=c.infoTitle; $('#infoText').textContent=c.info; $('#privacyText').textContent=c.privacy; $('#clearButton').textContent=c.clear; $('#soundButton').textContent=state.soundOn?'♩':'♩̸'; $('#soundButton').setAttribute('aria-label',state.soundOn?c.soundOn:c.soundOff);
          $('#styleTitle').textContent=c.styleTitle; $('#styleHint').textContent=c.styleHint; $('#inkHint').textContent=c.inkHint; $('#mobileSoundButton').textContent=state.soundOn?'♩':'♩̸'; renderStylePanel();
        }
        function renderStylePanel(){
          const names = state.lang==='zh' ? { 'hand-bold':'濃黑字','hand-round':'圓圓字','hand-fine':'細筆字','hand-penciled':'鉛筆字','hand-quick':'快寫字','hand-tall':'長筆字' } : { 'hand-bold':'Bold pen','hand-round':'Round hand','hand-fine':'Fine pen','hand-penciled':'Pencil','hand-quick':'Quick hand','hand-tall':'Tall hand' };
          $('#handChoices').innerHTML = PERSONAL_HANDS.map(hand=>'<button class="hand-choice '+hand+(state.userStyle.hand===hand?' selected':'')+'" data-hand="'+hand+'">'+names[hand]+'</button>').join('');
          $('#inkChoices').innerHTML = PERSONAL_INKS.map(ink=>'<button class="ink-choice '+(state.userStyle.ink===ink?' selected':'')+'" data-ink="'+ink+'" style="background:'+ink+'" aria-label="選擇筆色"></button>').join('');
          $('#handChoices').querySelectorAll('[data-hand]').forEach(el=>el.onclick=()=>{state.userStyle.hand=el.dataset.hand; state.notes.filter(n=>n.type==='personal').forEach(n=>n.hand=state.userStyle.hand); saveState(); render();});
          $('#inkChoices').querySelectorAll('[data-ink]').forEach(el=>el.onclick=()=>{state.userStyle.ink=el.dataset.ink; state.notes.filter(n=>n.type==='personal').forEach(n=>n.ink=state.userStyle.ink); saveState(); render();});
          memoInput.style.fontFamily = getComputedStyle(document.querySelector('.'+state.userStyle.hand)).getPropertyValue('--note-font') || 'KaiTi';
          memoInput.style.color = state.userStyle.ink;
        }
        function renderCrisis(){ const panel=$('#crisisPanel'); panel.textContent=COPY[state.lang].crisis; panel.classList.toggle('show',!!state.crisis); }
        function toggleLanguage(){ state.lang=state.lang==='zh'?'en':'zh'; saveState(); render(); }
        $('#postButton').addEventListener('click',addMemo);
        memoInput.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')addMemo();});
        $('#languageButton').addEventListener('click',toggleLanguage);
        $('#styleButton').addEventListener('click',()=>{ $('#stylePanel').classList.toggle('open'); $('#infoPanel').classList.remove('open'); });
        $('#soundButton').addEventListener('click',()=>{ state.soundOn=!state.soundOn; saveState(); applyCopy(); });
        $('#infoButton').addEventListener('click',()=>{ $('#infoPanel').classList.toggle('open'); $('#stylePanel').classList.remove('open'); });
        $('#clearButton').addEventListener('click',()=>{if(confirm(COPY[state.lang].clearConfirm)){localStorage.removeItem(STORAGE_KEY);state=defaultState();render();$('#infoPanel').classList.remove('open');}});
        $('#mobileAddButton').addEventListener('click',()=>{ document.querySelector('.compose-strip').scrollIntoView({behavior:'smooth',block:'start'}); window.setTimeout(()=>memoInput.focus(),230); });
        $('#mobileLanguageButton').addEventListener('click',toggleLanguage);
        $('#mobileStyleButton').addEventListener('click',()=>{ $('#stylePanel').classList.toggle('open'); $('#infoPanel').classList.remove('open'); });
        $('#mobileSoundButton').addEventListener('click',()=>{ state.soundOn=!state.soundOn; saveState(); applyCopy(); });
        $('#zoomInButton').addEventListener('click',()=>zoomBoard(.12));
        $('#zoomOutButton').addEventListener('click',()=>zoomBoard(-.12));
        $('#resetBoardButton').addEventListener('click',()=>{centerBoard(true);saveState();});
        wall.addEventListener('pointerdown',boardPointerDown);
        wall.addEventListener('pointermove',boardPointerMove);
        wall.addEventListener('pointerup',boardPointerUp);
        wall.addEventListener('pointercancel',boardPointerUp);
        window.addEventListener('resize',()=>{ if(isMobileBoard()) { centerBoard(false); applyBoard(); } });
        $('#modalClose').addEventListener('click',closeModal); $('#modalLayer').addEventListener('click',e=>{if(e.target===$('#modalLayer'))closeModal();});
        document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
        maybeCatchUp(); centerBoard(false); render(); window.setInterval(maybeTimedNote,60000); window.addEventListener('beforeunload',()=>{state.lastVisit=now();saveState();});
      })();
    </script>
  </body>
</html>
