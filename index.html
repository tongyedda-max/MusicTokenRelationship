<!DOCTYPE html>

<head>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* 🌐 滿版網頁顯示區域：現在百分之百填滿螢幕 */
        .site-container {
            width: 100%;
            height: 100%; 
            border: none;
            background-color: #fff;
            display: block;
        }

        /* 💡 縮小到角落的懸浮圓形按鈕 (FAB) */
        .menu-fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000; /* 保證在最上層 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid #333;
            transition: transform 0.2s, background-color 0.2s;
        }

        .menu-fab:hover {
            background-color: #222;
            transform: scale(1.05);
        }

        /* 💡 可摺疊的直式導覽選單（調整為從底部往上滑出） */
        .foldable-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 80%; /* 限制最大高度，留出上方空間，避免全遮擋 */
            overflow-y: auto; /* 項目多時可滾動 */
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column; 
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
            z-index: 9999;
            transition: transform 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94); /* 更流暢的動畫 */
            transform: translateY(105%); /* 預設完全隱藏在螢幕下方 */
            border-top-left-radius: 15px; /* 圓角看起來更精緻 */
            border-top-right-radius: 15px;
        }

        /* 當啟動 .show 時，選單滑出顯示 */
        .foldable-nav.show {
            transform: translateY(0);
        }

        /* 選單內項目樣式 */
        .foldable-nav button, .foldable-nav a {
            background: none;
            border: none;
            border-bottom: 1px solid #2a2a2a; 
            color: #bbb !important;
            font-size: 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 16px 25px; 
            box-sizing: border-box;
            width: 100%;
            transition: 0.2s;
        }

        /* 高亮變色 */
        .foldable-nav button:hover, .foldable-nav a:hover,
        .foldable-nav button.active-btn {
            color: #fff !important;
            background-color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ─── 🌐 滿版網頁顯示視窗 ─── -->
    <iframe

    <!-- ─── 💡 垂直摺疊選單（已包含您所有的 10 個項目） ─── -->

        <!-- 情況 A：同倉庫檔案，點擊直接在上方框框切換 -->

        <button onclick="switchSite('abrsm_dual_scoring_v3 (1).html', this)">📊 ABRSM 打分系統 by me</button>
        <button onclick="switchSite('abrsm-all-instruments-scale-draw (2).html', this)">📊 ABRSM scale 抽籤池</button>
        <button onclick="switchSite('小提琴練習選擇器.html', this)">小提琴練琴流程生成</button>

<button onclick="switchSite('https://tongyedda-max.github.io/feynan-game-offline/', this)">費曼教學法應用一對一線上課模擬教學</button>
        
 
        <p style="color: #ffffff;"><br>--below are made by others--</p>

<button onclick="switchSite('https://andywu1101.github.io/ear-training/', this)">👂 音樂聽力練習</button>

    </nav>

    <!-- 💡 右下角圓形懸浮按鈕 -->
    <div id="fab-btn" class="menu-fab" onclick="toggleMenu()">
        ☰
    </div>

    <!-- ─── ⚙️ 控制摺疊與切換的 JavaScript ─── -->
    <script>
        // 切換選單的展開與收合
        function toggleMenu() {
            const nav = document.getElementById('my-nav');
            const fab = document.getElementById('fab-btn');
            
            nav.classList.toggle('show');
            
            if (nav.classList.contains('show')) {
                fab.innerHTML = "✕";
                fab.style.backgroundColor = "#cc0000"; /* 展開時按鈕變紅色，提示關閉 */
                fab.style.border = "1px solid #ff3333";
            } else {
                fab.innerHTML = "☰";
                fab.style.backgroundColor = "#111";   /* 恢復黑色 */
                fab.style.border = "1px solid #333";
            }
        }

        // 切換內嵌框框的網址
        function switchSite(siteUrl, buttonElement) {
            // 1. 讓上方的 iframe 載入新頁面
            document.getElementById('web-window').src = siteUrl;

            // 2. 清除所有按鈕的高亮狀態
            const navItems = document.querySelectorAll('.foldable-nav button, .foldable-nav a');
            navItems.forEach(item => item.classList.remove('active-btn'));

            // 3. 讓當前按鈕變亮
            buttonElement.classList.add('active-btn');

            // 4. 選好網頁後，自動把選單收起來
            toggleMenu();
        }
    </script>

</body>
</html>
