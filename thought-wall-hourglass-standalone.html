  <style>
    :root{--ink:#524a3c;--muted:#817967;--paper:#fffdf5;--edge:rgba(121,96,55,.18);--green:#70866b;--wood:#835126;--light-min:.09;--light-max:.3;--breath:8s}*{box-sizing:border-box}html{min-height:100%;background:#f7efdb}body{min-height:100%;margin:0;color:var(--ink);font-family:ui-rounded,"PingFang TC","Noto Sans TC",system-ui,sans-serif;background:radial-gradient(circle at 50% 25%,rgba(255,254,245,.96),transparent 32%),linear-gradient(130deg,#eee0bc,#fbf5e6 48%,#eee1c0);-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(94,126,87,.64);outline-offset:3px}.page{min-height:100svh;display:grid;align-content:start;justify-items:center;padding:clamp(18px,4vh,44px) 16px 36px;overflow:hidden}.intro{text-align:center}.kicker{display:flex;justify-content:center;align-items:center;gap:6px;color:#837247;font-size:11px;letter-spacing:.08em}.kicker::before{content:"⌛";font-size:14px}.intro h1{margin:10px 0 5px;font-family:ui-serif,"Noto Serif TC",serif;font-size:clamp(31px,7vw,46px);letter-spacing:.04em}.intro p{margin:0;color:#817767;font-size:13px}.scene{position:relative;width:min(100%,420px);height:clamp(390px,51svh,490px);display:grid;place-items:center}.hourglass{position:relative;width:250px;height:330px;display:grid;place-items:center;transition:transform .62s cubic-bezier(.45,0,.55,1)}.hourglass.inverted{transform:rotate(180deg)}.hourglass::before{content:"";position:absolute;inset:13px;border-radius:42%;z-index:0;opacity:0;background:radial-gradient(ellipse at 50% 48%,rgba(232,214,167,.55),rgba(155,174,145,.1) 48%,transparent 74%)}.hourglass.light-on::before{animation:aura var(--breath) cubic-bezier(.42,0,.58,1) infinite}.hourglass.light-clear{--light-min:.16;--light-max:.48}.hourglass.light-off::before{display:none}.glass{position:absolute;z-index:1;width:150px;height:230px;overflow:hidden;border:4px solid rgba(83,112,109,.55);border-radius:52% 52% 48% 48% / 38% 38% 48% 48%;background:linear-gradient(100deg,rgba(255,255,255,.32),rgba(255,255,255,.04) 32%,rgba(249,253,249,.18));clip-path:polygon(4% 0,96% 0,54% 50%,96% 100%,4% 100%,46% 50%);box-shadow:inset 5px 0 8px rgba(255,255,255,.55),inset -4px 0 9px rgba(40,73,68,.13)}.glass::before,.glass::after{content:"";position:absolute;z-index:2;left:4%;width:92%;pointer-events:none}.glass::before{top:0;height:calc(var(--upper,100) * .5%);background:linear-gradient(#ffe9a6,#d99c36 72%,#7a4415);clip-path:polygon(0 0,100% 0,53% 100%,47% 100%)}.glass::after{bottom:0;height:calc(var(--lower,0) * .5%);min-height:2px;background:linear-gradient(#ffe8a5,#b97724 72%,#71400f);clip-path:polygon(49% 0,51% 0,100% 100%,0 100%)}.sand-mask{display:none}.sand-stream{position:absolute;z-index:4;top:48%;left:calc(50% - 1px);width:2px;height:calc(var(--stream,0) * 1.1px);background:linear-gradient(#e5b44b,#93601f);opacity:var(--stream-opacity,0);box-shadow:0 0 4px rgba(209,160,55,.45)}.wood{position:absolute;z-index:5;width:205px;height:15px;background:linear-gradient(#8a5325,#d49b52 40%,#75441f);box-shadow:0 7px 0 rgba(102,59,23,.82),0 12px 7px rgba(71,45,20,.16)}.wood.top{top:29px}.wood.bottom{bottom:29px}.post{position:absolute;z-index:5;top:43px;width:10px;height:244px;background:linear-gradient(90deg,#6f421e,#9b622e,#5f3819);box-shadow:2px 0 0 rgba(244,196,107,.34)}.post.left{left:30px}.post.right{right:30px}.timer{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);margin:0;font-weight:800;font-size:17px;letter-spacing:.05em}.quick{position:absolute;z-index:8;right:0;top:29%;width:48px;height:48px;border:1px solid rgba(120,97,55,.19);border-radius:50%;color:#6e6d54;background:rgba(255,253,246,.86);box-shadow:0 8px 18px rgba(84,66,36,.12);font-size:20px}.quick.above{z-index:30;color:#fffdf7;background:var(--green);border-color:#5b7155}.settings{position:absolute;z-index:20;top:clamp(20px,8vh,66px);left:50%;width:min(calc(100vw - 30px),520px);max-height:min(76svh,590px);overflow:auto;transform:translateX(-50%);padding:8px;background:rgba(238,229,203,.92);border:1px solid rgba(119,94,52,.22);border-radius:20px 28px 20px 25px;box-shadow:0 24px 54px rgba(65,49,27,.24),0 0 0 100vmax rgba(83,67,40,.09);backdrop-filter:blur(10px)}.settings[hidden]{display:none}.controls{display:grid;gap:8px;padding:22px 14px 16px;background:linear-gradient(135deg,rgba(255,253,246,.96),rgba(248,242,226,.9));border:1px solid var(--edge);border-radius:14px 21px 14px 18px}.group{overflow:hidden;border:1px solid var(--edge);border-radius:10px 14px 10px 12px;background:rgba(255,253,246,.5)}.group-head{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 13px;color:var(--ink);background:transparent;border:0;text-align:left}.group-head span{display:grid;gap:2px}.group-head b{font-size:13px}.group-head small{color:var(--muted);font-size:10px;font-weight:700}.chev{transition:transform .2s}.group.open .chev{transform:rotate(180deg)}.group-body{display:none;gap:15px;padding:2px 13px 15px}.group.open .group-body{display:grid}.field{display:grid;gap:8px}.field label,.field-title{color:#706757;font-size:12px;font-weight:800}.choices,.tones,.presets{display:flex;flex-wrap:wrap;gap:7px}.choices button,.presets button{min-height:34px;padding:7px 10px;color:#685f50;background:rgba(249,244,231,.86);border:1px solid rgba(128,104,65,.18);border-radius:8px 12px 8px 10px;font-size:11px;font-weight:800}.choices button.active,.presets button.active{color:#fffdf7;background:var(--green);border-color:#5c7458}.tones button{display:flex;flex:1 1 42%;align-items:center;gap:7px;min-width:115px;padding:9px;color:#655b4c;background:rgba(255,253,246,.7);border:1px solid rgba(128,104,65,.16);border-radius:9px 13px 9px 11px;text-align:left}.tones button.active{border-color:#688164;box-shadow:inset 0 0 0 1px #688164}.tone-dot{width:17px;height:17px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(80,60,35,.14)}.tone-dot.amber{background:#e4b44c}.tone-dot.rose{background:#d28d87}.tone-dot.sea{background:#98c4c6}.tone-dot.moss{background:#91a975}.tones small{display:block;color:#817767;font-size:9px}.range{display:grid;gap:7px;color:#6e6658;font-size:12px;font-weight:800}.range span{display:flex;justify-content:space-between}.range output{padding:2px 7px;color:#687f62;background:rgba(104,127,98,.1);border-radius:999px;font-size:11px}.range input{width:100%;accent-color:var(--green)}.actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}.actions button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 12px;border-radius:8px 13px 8px 11px;font-size:12px;font-weight:800}.primary{flex:1 1 190px;color:#fffdf7;background:var(--green);border:0;box-shadow:0 8px 16px rgba(84,111,78,.2)}.neutral{color:#665d4e;background:rgba(249,244,231,.85);border:1px solid var(--edge)}.reset{color:#837964;background:transparent;border:1px dashed rgba(128,104,65,.28)}.release{width:min(100%,550px);margin-top:4px;border:1px solid var(--edge);border-radius:16px 23px 16px 20px;background:rgba(255,253,246,.6);box-shadow:0 8px 20px rgba(83,62,31,.055)}.release-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 15px;color:var(--ink);background:transparent;border:0;text-align:left}.release-toggle span{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}.release-toggle b{font-size:13px}.release-toggle small{grid-column:2;margin-top:2px;color:#827a69;font-size:10px;font-weight:600}.release-body{display:none;gap:12px;padding:0 15px 20px}.release.open .release-body{display:grid}.release-step{display:grid;gap:12px}.release-step p{margin:0;color:#695f4f;font-size:13px;line-height:1.7}.release-step b{display:block;margin-bottom:4px;color:#514838}.release-field{display:grid;gap:7px;color:#6d6555;font-size:12px;font-weight:800}.release-field input,.release-field textarea{width:100%;padding:11px 12px;color:#4d473b;background:rgba(255,254,249,.72);border:1px solid rgba(126,102,64,.22);border-radius:9px 13px 9px 11px;font-size:13px;line-height:1.55;resize:vertical}.step-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.step-actions button,.hint button{padding:8px 10px;font-size:12px;font-weight:800}.secondary{color:#7c704f;background:transparent;border:0;border-bottom:1px dashed rgba(134,108,64,.4)}.release-primary{justify-self:start;padding:10px 14px;color:#fffdf7;background:var(--green);border:0;border-radius:8px 13px 8px 11px;box-shadow:0 8px 16px rgba(84,111,78,.18);font-size:12px;font-weight:800}.hint{display:flex;flex-wrap:wrap;gap:7px}.hint button{color:#695f4f;background:rgba(255,253,246,.72);border:1px solid rgba(128,104,65,.18);border-radius:999px}.hint button.active{color:#fffdf7;background:var(--green)}.named{display:grid;gap:5px;padding:12px 13px;background:rgba(250,244,229,.78);border-left:3px solid rgba(145,113,59,.55);border-radius:3px 11px 11px 3px}.named b{font-size:14px}.named p{margin:0;white-space:pre-wrap;font-size:12px}.decisions{display:grid;gap:8px}.decision{padding:12px;color:#625949;background:rgba(255,253,246,.7);border:1px solid rgba(128,104,65,.2);border-radius:10px 14px 10px 12px;text-align:left}.decision b{font-size:12px}.decision small{display:block;margin-top:3px;color:#827a69;font-size:10px;font-weight:600}@keyframes aura{0%,100%{opacity:var(--light-min);transform:scale(.99)}50%{opacity:var(--light-max);transform:scale(1.028)}}@media (max-width:420px){.page{padding-top:18px}.scene{height:390px}.hourglass{transform:scale(.88)}.hourglass.inverted{transform:rotate(180deg) scale(.88)}.timer{bottom:8px}.quick{right:2px}.release{margin-top:0}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    /* 寫實沙漏：直接沿用現行頁面的 Canvas 構成比例，不以幾何 CSS 形狀替代玻璃與流砂。 */
    .hourglass{width:min(76vw,360px);height:auto;margin:0;padding:10px;transform-origin:center;isolation:isolate}.hourglass-canvas{display:block;width:100%;height:auto;aspect-ratio:300/326;filter:drop-shadow(0 3px 3px rgba(91,55,20,.28))}.hourglass .glass,.hourglass .wood,.hourglass .post{display:none}@media(max-width:420px){.hourglass{width:min(66vw,255px);padding:5px}.hourglass.inverted{transform:rotate(180deg) scale(1)}}
  </style>
</head>
<body>
  <main class="page">
    <header class="intro"><span class="kicker">停一下</span><h1>讓沙流一會</h1><p>不用完成甚麼。只看它慢慢落下。</p></header>
    <section class="scene" aria-label="沙漏冥想工具">
      <div id="hourglass" class="hourglass light-on"><canvas id="realisticCanvas" class="hourglass-canvas" aria-hidden="true"></canvas></div>
      <button id="settingsButton" class="quick" aria-label="開啟沙漏設定" title="沙漏設定">☷</button>
      <p id="timer" class="timer" aria-live="polite">1 分鐘</p>
      <aside id="settings" class="settings" hidden aria-label="沙漏設定"><div class="controls">
        <section class="group open" data-group="hourglass"><button class="group-head"><span><b>沙漏</b><small id="hourglassSummary">1 分鐘 · 琥珀細沙</small></span><i class="chev">⌄</i></button><div class="group-body">
          <div class="field"><label>沙漏時長</label><div id="durationChoices" class="choices"></div></div>
          <div class="field"><label>沙子的顏色</label><div id="toneChoices" class="tones"></div></div>
        </div></section>
        <section class="group" data-group="light"><button class="group-head"><span><b>呼吸燈</b><small id="lightSummary">開啟 · 柔和 · 8 秒</small></span><i class="chev">⌄</i></button><div class="group-body">
          <div class="field"><label>呼吸節奏</label><div id="breathChoices" class="choices"></div></div>
          <div class="field"><label>外框呼吸燈</label><div id="lightSwitch" class="choices"></div></div>
          <div id="intensityField" class="field"><label>明顯程度</label><div id="intensityChoices" class="choices"></div></div>
        </div></section>
        <section class="group" data-group="sound"><button class="group-head"><span><b>聲音</b><small id="soundSummary">無環境音 · 沙粒靜音</small></span><i class="chev">⌄</i></button><div class="group-body">
          <div class="field"><label>自然環境音</label><div id="ambientChoices" class="choices"></div></div>
          <div class="field"><label>快速比例</label><div id="presetChoices" class="presets"></div></div>
          <label class="range"><span>沙粒聲音量 <output id="sandOut">50%</output></span><input id="sandRange" type="range" min="0" max="100" value="50" /></label>
          <label class="range"><span>環境音音量 <output id="ambientOut">55%</output></span><input id="ambientRange" type="range" min="0" max="100" value="55" /></label>
        </div></section>
        <div class="actions"><button id="startButton" class="primary">⌛ 開始觀察細沙</button><button id="soundButton" class="neutral">♬ 沙粒聲靜音</button><button id="resetButton" class="reset">↺ 重設偏好</button></div>
      </div></aside>
    </section>
    <section id="release" class="release"><button id="releaseToggle" class="release-toggle" aria-expanded="false"><span><i>✧</i><b>釋放想法</b><small>寫下還在心裡轉的事</small></span><i id="releaseChevron">⌄</i></button><div id="releaseBody" class="release-body"></div></section>
  </main>
  <script>
  (()=>{
    const key='thought-wall-hourglass-standalone-preferences-v1';
    const defaults={minutes:1,tone:'amber',breathSeconds:8,breathLightOn:true,breathLightIntensity:'soft',sandSoundOn:false,ambientSound:null,sandVolume:50,ambientVolume:55};
    const tones={amber:['琥珀','暖金色細沙'],rose:['玫瑰','安靜粉砂'],sea:['海霧','低飽和藍砂'],moss:['苔綠','沈靜綠砂']};
    const groups={怕:['擔心','緊張','不安心','怕做錯','怕被否定','不知道怎麼辦'],煩:['壓力很大','被催促','事情太多','停不下來','想逃開','一直重複想'],'難過／委屈':['失望','被忽略','不被理解','孤單','想哭','覺得不公平'],生氣:['被冒犯','很不耐煩','覺得被逼','想反駁','忍很久了','受不了'],'悶住／說不清楚':['身體很緊','胸口悶','腦霧','僵住','沒有力氣','只是怪怪的']};
    let prefs={...defaults}; try{prefs={...prefs,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}
    let progress=0,running=false,inverted=false,releaseStage='intro',releaseName='',releaseThought='',releaseGroup='',timerId=null,audio=null;
    const $=id=>document.getElementById(id),hourglass=$('hourglass'),glass=$('glass'),timer=$('timer'),settings=$('settings'),release=$('release'),releaseBody=$('releaseBody');
    function save(){localStorage.setItem(key,JSON.stringify(prefs));renderSettings();renderHourglass()}
    function choose(container,items,current,callback,formatter=x=>x){const el=$(container);el.innerHTML='';items.forEach(item=>{const b=document.createElement('button');b.textContent=formatter(item);b.className=item===current?'active':'';b.onclick=()=>callback(item);el.appendChild(b)})}
    const toneColors={amber:['rgba(255,231,159,.98)','rgba(215,165,69,.94)','rgba(125,77,24,.92)'],rose:['rgba(255,221,214,.98)','rgba(206,130,124,.94)','rgba(129,73,74,.92)'],sea:['rgba(213,239,236,.98)','rgba(102,157,162,.94)','rgba(48,94,107,.92)'],moss:['rgba(224,234,192,.98)','rgba(129,157,86,.94)','rgba(67,99,53,.92)']};
    function drawRealisticHourglass(){const canvas=$('realisticCanvas'),ctx=canvas.getContext('2d');if(!ctx)return;const W=180,H=208,scale=Math.min(devicePixelRatio||1,2);canvas.width=300*scale;canvas.height=326*scale;ctx.setTransform(scale*(300/W),0,0,scale*(300/W),0,0);ctx.clearRect(0,0,W,H);const upperTop=48,neckY=105,lowerBottom=164,left=45,right=135,center=90,p=Math.max(0,Math.min(1,progress)),colors=toneColors[prefs.tone];const n=s=>Math.abs(Math.sin(s*12.9898+prefs.tone.length*78.233)*43758.5453)%1,gc=s=>colors[Math.floor(n(s+17)*3)%3];const inner=()=>{ctx.beginPath();ctx.moveTo(center,neckY);ctx.bezierCurveTo(70,91,46.2,71,46.8,48.8);ctx.quadraticCurveTo(center,46.8,133.2,48.8);ctx.bezierCurveTo(133.8,71,110,91,center,neckY);ctx.bezierCurveTo(110,119,133.8,140,133.2,163.2);ctx.quadraticCurveTo(center,165.2,46.8,163.2);ctx.bezierCurveTo(46.2,140,70,119,center,neckY);ctx.closePath()};const topRatio=Math.max(.035,1-p),surface=neckY-(neckY-upperTop)*topRatio,lowH=Math.max(2,(lowerBottom-neckY)*p),apex=lowerBottom-lowH;ctx.save();inner();ctx.clip();if(topRatio>.04){const grad=ctx.createLinearGradient(center,upperTop,center,neckY);grad.addColorStop(0,colors[0]);grad.addColorStop(.54,colors[1]);grad.addColorStop(1,colors[2]);ctx.fillStyle=grad;ctx.globalAlpha=.92;ctx.fillRect(left-8,surface,right-left+16,neckY-surface+2);for(let i=0;i<44;i++){const s=110+i*19.23;ctx.fillStyle=gc(s);ctx.globalAlpha=.16+n(s+3)*.22;ctx.beginPath();ctx.arc(left-2+n(s+2)*(right-left+4),surface+n(s)*Math.max(3,neckY-surface-2),.16+n(s+4)*.3,0,Math.PI*2);ctx.fill()}}if(p>.02){ctx.beginPath();ctx.moveTo(center,apex);ctx.quadraticCurveTo(center+lowH*1.1,lowerBottom-5,right+2,lowerBottom+2);ctx.quadraticCurveTo(center,lowerBottom+5,left-2,lowerBottom+2);ctx.quadraticCurveTo(center-lowH*1.1,lowerBottom-5,center,apex);ctx.closePath();const grad=ctx.createLinearGradient(center,apex,center,lowerBottom);grad.addColorStop(0,colors[0]);grad.addColorStop(1,colors[2]);ctx.fillStyle=grad;ctx.globalAlpha=.92;ctx.fill();for(let i=0;i<62;i++){const s=480+i*15.37;ctx.fillStyle=gc(s);ctx.globalAlpha=.18+n(s+4)*.2;ctx.beginPath();ctx.arc(left-2+n(s+2)*(right-left+4),apex+n(s)*Math.max(1,lowerBottom-apex-1),.2+n(s+5)*.3,0,Math.PI*2);ctx.fill()}}if(running&&p<.99){const d=Math.max(8,apex-neckY),phase=p*4.8;ctx.strokeStyle=colors[1];ctx.globalAlpha=.58;ctx.lineWidth=.72;ctx.beginPath();ctx.moveTo(center,neckY-2);ctx.lineTo(center,Math.min(apex-2,neckY+7));ctx.stroke();for(let i=0;i<5;i++){const s=i*27.1+phase,y=neckY+((i*11.2+phase*.44)%d);ctx.fillStyle=gc(s);ctx.globalAlpha=.56+n(s+8)*.16;ctx.beginPath();ctx.arc(center+(n(s+31)-.5)*.5,y,.28+n(s+11)*.2,0,Math.PI*2);ctx.fill()}}ctx.restore();const wood=ctx.createLinearGradient(0,18,0,190);wood.addColorStop(0,'#75461f');wood.addColorStop(.2,'#d6a35a');wood.addColorStop(.54,'#8a5725');wood.addColorStop(1,'#c28b43');ctx.fillStyle='rgba(49,31,15,.2)';ctx.fillRect(28,181,124,8);ctx.fillStyle=wood;ctx.fillRect(30,20,120,8);ctx.fillRect(27,29,126,6);ctx.fillRect(27,168,126,6);ctx.fillRect(30,175,120,8);ctx.fillStyle='rgba(70,43,20,.84)';ctx.fillRect(33,32,5,137);ctx.fillRect(142,32,5,137);ctx.fillStyle='rgba(246,209,126,.44)';ctx.fillRect(38,33,1.5,135);ctx.fillRect(141,33,1.5,135);ctx.strokeStyle='rgba(245,251,248,.88)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(left,upperTop);ctx.bezierCurveTo(46,71,72,91,center,neckY);ctx.bezierCurveTo(108,119,134,140,right,lowerBottom);ctx.moveTo(right,upperTop);ctx.bezierCurveTo(134,71,108,91,center,neckY);ctx.bezierCurveTo(72,119,46,140,left,lowerBottom);ctx.stroke();ctx.strokeStyle='rgba(67,90,85,.46)';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(left-1.3,upperTop);ctx.bezierCurveTo(44,71,70,91,center-1,neckY);ctx.bezierCurveTo(106,119,132,140,right+1.3,lowerBottom);ctx.moveTo(right+1.3,upperTop);ctx.bezierCurveTo(136,71,110,91,center+1,neckY);ctx.bezierCurveTo(74,119,48,140,left-1.3,lowerBottom);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.62)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(55,55);ctx.quadraticCurveTo(66,65,77,81);ctx.moveTo(125,130);ctx.quadraticCurveTo(116,141,106,151);ctx.stroke()}
    function renderHourglass(){drawRealisticHourglass();hourglass.className='hourglass '+(inverted?'inverted ':'')+(prefs.breathLightOn?'light-on ':'light-off ')+(prefs.breathLightIntensity==='clear'?'light-clear':'');hourglass.style.setProperty('--breath',prefs.breathSeconds+'s'); const remain=Math.max(0,Math.round(prefs.minutes*60*(1-progress)));timer.textContent=running?Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0'):progress>=1?'細沙已落定':prefs.minutes+' 分鐘';$('startButton').textContent=running?'↻ 倒轉沙漏':progress>=1?'⌛ 再讓細沙流一會':'⌛ 開始觀察細沙'}
    function renderSettings(){choose('durationChoices',[1,3,5,10],prefs.minutes,v=>{if(!running){prefs.minutes=v;progress=0;inverted=false;save()}},v=>v+' 分鐘');const toneEl=$('toneChoices');toneEl.innerHTML='';Object.entries(tones).forEach(([name,[label,detail]])=>{const b=document.createElement('button');b.className=name===prefs.tone?'active':'';b.innerHTML='<i class="tone-dot '+name+'"></i><span><b>'+label+'</b><small>'+detail+'</small></span>';b.onclick=()=>{prefs.tone=name;save()};toneEl.appendChild(b)});choose('breathChoices',[4,8,12],prefs.breathSeconds,v=>{prefs.breathSeconds=v;save()},v=>(v===4?'平穩':v===8?'慢慢':'更慢')+' · '+v+' 秒');choose('lightSwitch',[true,false],prefs.breathLightOn,v=>{prefs.breathLightOn=v;save()},v=>v?'打開':'關上');$('intensityField').hidden=!prefs.breathLightOn;choose('intensityChoices',['soft','clear'],prefs.breathLightIntensity,v=>{prefs.breathLightIntensity=v;save()},v=>v==='soft'?'柔和 · 低透明度':'明顯 · 高透明度');choose('ambientChoices',[null,'rain','waves'],prefs.ambientSound,v=>{prefs.ambientSound=v;restartAudio();save()},v=>v===null?'不播放':v==='rain'?'雨聲':'海浪聲');choose('presetChoices',['muted','balanced','immersive'],(prefs.sandVolume===0&&prefs.ambientVolume===0)?'muted':(prefs.sandVolume===50&&prefs.ambientVolume===55)?'balanced':(prefs.sandVolume===28&&prefs.ambientVolume===78)?'immersive':'',v=>{({muted:[0,0],balanced:[50,55],immersive:[28,78]})[v].forEach((n,i)=>i?prefs.ambientVolume=n:prefs.sandVolume=n);restartAudio();save()},v=>({muted:'靜音',balanced:'平衡',immersive:'沉浸'})[v]);$('sandRange').value=prefs.sandVolume;$('ambientRange').value=prefs.ambientVolume;$('sandOut').textContent=prefs.sandVolume+'%';$('ambientOut').textContent=prefs.ambientVolume+'%';$('hourglassSummary').textContent=prefs.minutes+' 分鐘 · '+tones[prefs.tone][0]+'細沙';$('lightSummary').textContent=prefs.breathLightOn?'開啟 · '+(prefs.breathLightIntensity==='soft'?'柔和':'明顯')+' · '+prefs.breathSeconds+' 秒':'關上';$('soundSummary').textContent=(prefs.ambientSound==='rain'?'雨聲':prefs.ambientSound==='waves'?'海浪聲':'無環境音')+' · 沙粒 '+(prefs.sandSoundOn?prefs.sandVolume+'%':'靜音');$('soundButton').textContent=prefs.sandSoundOn?'♬ 沙粒聲已選':'♬ 沙粒聲靜音'}
    function tick(){if(!running)return;progress=Math.min(1,progress+0.1/(prefs.minutes*60));if(progress>=1){running=false;stopAudio()}renderHourglass()}
    function startOrFlip(){if(running){inverted=!inverted;hourglass.style.transition='transform .62s cubic-bezier(.45,0,.55,1)';progress=1-progress;setTimeout(()=>{running=true;startAudio();renderHourglass()},620)}else{if(progress>=1)progress=0;running=true;startAudio();renderHourglass()}}
    function makeNoise(type,gainValue){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;const c=new C(),buf=c.createBuffer(1,c.sampleRate*2,c.sampleRate),data=buf.getChannelData(0);let sm=0;for(let i=0;i<data.length;i++){const w=Math.random()*2-1;sm=sm*(type==='waves'?.986:.74)+w*(type==='waves'?.014:.26);data[i]=sm}const src=c.createBufferSource(),gain=c.createGain(),filter=c.createBiquadFilter();src.buffer=buf;src.loop=true;filter.type=type==='waves'?'lowpass':'bandpass';filter.frequency.value=type==='waves'?520:2300;gain.gain.value=gainValue;src.connect(filter).connect(gain).connect(c.destination);src.start();return{c,src}}
    function stopAudio(){if(audio){audio.forEach(x=>{try{x.src.stop();x.c.close()}catch(e){}});audio=null}}
    function startAudio(){stopAudio();audio=[];if(prefs.sandSoundOn)audio.push(makeNoise('sand',.024*prefs.sandVolume/100));if(prefs.ambientSound)audio.push(makeNoise(prefs.ambientSound,(prefs.ambientSound==='rain'?.13:.19)*prefs.ambientVolume/100));audio=audio.filter(Boolean)}function restartAudio(){if(running||prefs.sandSoundOn||prefs.ambientSound)startAudio()}
    function renderRelease(){let html='';if(releaseStage==='intro')html='<div class="release-step"><p><b>心裡有一件事還轉著嗎？</b>不用急著解決它，先讓它在這裡有個位置。</p><button class="release-primary" data-next="name">開始這一步</button></div>';if(releaseStage==='name')html='<div class="release-step"><p><b>它現在比較像甚麼？</b>替它起一個暫時名字就好；不用寫得準確。</p><label class="release-field">暫時名字<input id="releaseName" placeholder="例如：怕做錯、被催促、胸口悶" value="'+escapeHtml(releaseName)+'" /></label><div class="step-actions"><button class="secondary" data-next="hints">不知道怎麼寫</button><button class="release-primary" data-next="thought-choice">下一步</button></div></div>';if(releaseStage==='hints'){html='<div class="release-step"><p><b>先選一個最接近的方向。</b>不用選得準確。</p><div class="hint">'+Object.keys(groups).map(x=>'<button data-root="'+x+'" class="'+(releaseGroup===x?'active':'')+'">'+x+'</button>').join('')+'</div>'+(releaseGroup?'<div class="hint">'+groups[releaseGroup].map(x=>'<button data-option="'+x+'">'+x+'</button>').join('')+'</div>':'')+'<button class="secondary" data-next="name">我想自己寫</button></div>'}if(releaseStage==='thought-choice')html='<div class="release-step"><p><b>有沒有一件正在卡住的事？</b>如果沒有，也完全可以先不寫。</p><div class="step-actions"><button class="secondary" data-next="pause">先不寫</button><button class="release-primary" data-next="thought-write">寫一句</button></div></div>';if(releaseStage==='thought-write')html='<div class="release-step"><p><b>把正在卡住的事寫一句就好。</b>不用交代完整。</p><label class="release-field">現在卡住的事<textarea id="releaseThought" rows="3" placeholder="例如：我一直想著明天要怎麼回覆那封訊息。">'+escapeHtml(releaseThought)+'</textarea></label><button class="release-primary" data-next="pause">下一步</button></div>';if(releaseStage==='pause')html='<div class="release-step"><div class="named"><b>'+escapeHtml(releaseName)+'</b>'+(releaseThought?'<p>'+escapeHtml(releaseThought)+'</p>':'')+'</div><p><b>現在不用解決它。</b>看著沙子落下，吐一口比平常慢的氣；讓肩膀、下巴或手指少用一點力。</p><button class="release-primary" data-next="choose">再看一會沙流</button></div>';if(releaseStage==='choose')html='<div class="release-step"><p><b>剛才寫下的內容，現在還要繼續握著，還是可以先讓它離開？</b></p><div class="decisions"><button class="decision" data-next="pause"><b>我還沒放下</b><small>先讓它留在這裡，再看沙流一會</small></button><button class="decision" data-next="released"><b>我已經放下了</b><small>先感覺一下身體鬆開的位置，讓空氣慢慢流過</small></button></div></div>';if(releaseStage==='released')html='<div class="release-step"><p><b>它已經可以先離開了。</b>感覺一下現在的呼吸、肩膀，和身邊流動的空氣。</p><button class="release-primary" data-next="reset-release">回到一開始</button></div>';releaseBody.innerHTML=html;releaseBody.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{const next=b.dataset.next;if(next==='thought-choice'){const input=$('releaseName');releaseName=input?input.value.trim():releaseName;if(!releaseName){alert('先替現在的感覺寫一個暫時名字；不用寫得準確。');return}}if(next==='pause'){const t=$('releaseThought');if(t)releaseThought=t.value.trim()}if(next==='reset-release'){releaseName='';releaseThought='';releaseGroup='';releaseStage='intro';release.classList.remove('open');$('releaseToggle').setAttribute('aria-expanded','false')}else releaseStage=next;renderRelease()});releaseBody.querySelectorAll('[data-root]').forEach(b=>b.onclick=()=>{releaseGroup=b.dataset.root;renderRelease()});releaseBody.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{releaseName=releaseGroup+'：'+b.dataset.option;releaseGroup='';releaseStage='thought-choice';renderRelease()})}
    function escapeHtml(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    document.querySelectorAll('.group-head').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));$('settingsButton').onclick=()=>{settings.hidden=!settings.hidden;$('settingsButton').classList.toggle('above',!settings.hidden)};$('startButton').onclick=startOrFlip;$('soundButton').onclick=()=>{prefs.sandSoundOn=!prefs.sandSoundOn;restartAudio();save()};$('resetButton').onclick=()=>{stopAudio();prefs={...defaults};progress=0;running=false;inverted=false;localStorage.removeItem(key);save()};$('sandRange').oninput=e=>{prefs.sandVolume=+e.target.value;restartAudio();save()};$('ambientRange').oninput=e=>{prefs.ambientVolume=+e.target.value;restartAudio();save()};$('releaseToggle').onclick=()=>{release.classList.toggle('open');$('releaseToggle').setAttribute('aria-expanded',release.classList.contains('open'));renderRelease()};setInterval(tick,100);renderSettings();renderHourglass();renderRelease();
  })();
