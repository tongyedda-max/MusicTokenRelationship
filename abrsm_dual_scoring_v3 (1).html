<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ABRSM 評分表 / Scoring Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ====== Reset & Base ====== */
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding: 0;
}
html, body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #FAF7F2;
  color: #1A1A1A;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}
body { overscroll-behavior-y: none; }
button {
  font-family: inherit;
  font-size: inherit;
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
  touch-action: manipulation;
}
input, textarea, select {
  font-family: inherit;
  font-size: 16px; /* Prevents iOS zoom */
  -webkit-appearance: none;
  appearance: none;
}
h1, h2, h3, h4 {
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
  line-height: 1.3;
  color: #1A1A1A;
}

/* ====== Variables ====== */
:root {
  --bg: #FAF7F2;
  --bg-card: #FFFFFF;
  --bg-soft: #F5F1E8;
  --text-primary: #1A1A1A;
  --text-secondary: #5C5C5C;
  --text-tertiary: #8A8A8A;
  --border: #E8E0D3;
  --border-strong: #C9BFA8;
  --accent: #B8941F;
  --accent-soft: #F5E9C8;
  --gold: #B8941F;
  --silver: #6B7B8A;
  --green: #4A7C59;
  --orange: #B8814A;
  --red: #A8484E;
  --shadow-sm: 0 1px 3px rgba(60, 40, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(60, 40, 0, 0.06);
  --shadow-lg: 0 8px 24px rgba(60, 40, 0, 0.10);
}

/* ====== Layout ====== */
.container {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 16px 32px;
}

/* ====== Top Navigation ====== */
.top-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.mode-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-soft);
  border-radius: 10px;
  padding: 3px;
  flex: 1;
  max-width: 460px;
}
.mode-tab {
  flex: 1;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.18s ease;
  text-align: center;
  line-height: 1.2;
}
.mode-tab .zh-part { font-weight: 600; }
.mode-tab .en-part { font-size: 0.78em; opacity: 0.7; margin-left: 3px; }
.mode-tab.active {
  background: white;
  color: var(--accent);
  box-shadow: var(--shadow-sm);
}
.lang-toggle {
  display: flex;
  gap: 2px;
  background: var(--bg-soft);
  border-radius: 8px;
  padding: 3px;
  flex-shrink: 0;
}
.lang-btn {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: all 0.18s ease;
}
.lang-btn.active {
  background: var(--accent);
  color: white;
}

/* ====== Sub Navigation ====== */
.sub-nav {
  position: sticky;
  top: 49px;
  z-index: 99;
  background: rgba(250, 247, 242, 0.96);
  backdrop-filter: saturate(180%) blur(8px);
  -webkit-backdrop-filter: saturate(180%) blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
}
.sub-tabs {
  display: flex;
  gap: 6px;
  max-width: 920px;
  margin: 0 auto;
}
.sub-tab {
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.18s ease;
}
.sub-tab .zh-part { font-weight: 600; }
.sub-tab .en-part { font-size: 0.85em; opacity: 0.7; margin-left: 3px; }
.sub-tab.active {
  background: var(--accent-soft);
  color: var(--accent);
}

/* ====== Page (sections) ====== */
.page {
  display: none;
  padding-top: 16px;
}
.page.active { display: block; }

/* ====== Card ====== */
.card {
  background: var(--bg-card);
  border-radius: 14px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 18px;
  margin-bottom: 14px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title .zh-part { font-weight: 700; }
.card-title .en-part {
  font-size: 0.78em;
  opacity: 0.6;
  font-weight: 500;
  font-family: 'Noto Sans SC', sans-serif;
}
.card-title .badge-star {
  color: var(--accent);
  font-size: 1.1em;
  margin-right: 2px;
}

/* ====== Info Grid ====== */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 12px;
}
.info-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.info-field .label {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}
.info-field .label .en-part {
  font-size: 0.92em;
  opacity: 0.7;
  margin-left: 3px;
}
.info-input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg-soft);
  color: var(--text-primary);
  font-size: 16px;
  transition: all 0.15s ease;
}
.info-input:focus {
  outline: none;
  border-color: var(--accent);
  background: white;
  box-shadow: 0 0 0 3px var(--accent-soft);
}

/* ====== Piece Card ====== */
.piece-card {
  background: var(--bg-card);
  border-radius: 14px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
  overflow: hidden;
}
.piece-header {
  padding: 14px 16px 8px;
  border-bottom: 1px dashed var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.piece-num {
  flex-shrink: 0;
  background: var(--accent);
  color: white;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
  font-size: 14px;
}
.piece-name-input {
  flex: 1;
  min-width: 140px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg-soft);
  font-size: 16px;
  transition: all 0.15s ease;
}
.piece-name-input:focus {
  outline: none;
  border-color: var(--accent);
  background: white;
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.piece-subtotal {
  flex-shrink: 0;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg-soft);
  padding: 4px 10px;
  border-radius: 6px;
}
.piece-subtotal .num { color: var(--accent); font-size: 1.1em; }

/* ====== Criterion ====== */
.criterion {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.criterion:last-child { border-bottom: none; }
.criterion-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.criterion-name {
  display: flex;
  align-items: baseline;
  gap: 4px;
  font-weight: 500;
  font-size: 15px;
}
.criterion-name .zh-part { color: var(--text-primary); font-weight: 600; }
.criterion-name .en-part {
  font-size: 0.85em;
  color: var(--text-tertiary);
  font-weight: 400;
}
.lang-en .criterion-name .en-part { color: var(--text-primary); font-weight: 500; }

.score-row {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.score-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid var(--c, #ccc);
  background: white;
  color: var(--c, #ccc);
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.16s ease;
  flex-shrink: 0;
}
.score-btn:active { transform: scale(0.92); }
.score-btn.selected {
  background: var(--c);
  color: white;
  transform: scale(1.08);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
}


/* ====== Direct Mark Controls & Reference Accordions ====== */
.direct-assessment { position: relative; }
.score-control {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.score-control .score-btn { width: 34px; height: 34px; }
.score-divider { width: 1px; height: 26px; background: var(--border-strong); margin: 0 1px; }
.score-adjust {
  width: 30px;
  height: 30px;
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  background: white;
  color: var(--accent);
  font-size: 20px;
  font-weight: 600;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.score-adjust:active { transform: scale(0.94); background: var(--accent-soft); }
.score-adjust:disabled,
.score-btn:disabled,
.score-input:disabled { opacity: 0.42; cursor: not-allowed; }
.score-input {
  width: 52px;
  height: 30px;
  padding: 3px 4px;
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  background: white;
  color: var(--text-primary);
  text-align: center;
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
  -moz-appearance: textfield;
}
.score-input::-webkit-inner-spin-button,
.score-input::-webkit-outer-spin-button { -webkit-appearance: auto; margin: 0; }
.score-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.criterion-max { color: var(--text-tertiary); font-size: 0.85em; margin-left: 2px; font-weight: 400; }
.tech-control-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.reference-accordion { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: white; }
.reference-toggle { width: 100%; min-height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; background: var(--bg-soft); color: var(--text-secondary); font-size: 12px; font-weight: 600; text-align: left; }
.reference-toggle:active { background: var(--accent-soft); }
.reference-chevron { flex-shrink: 0; font-size: 18px; line-height: 1; color: var(--accent); }
.reference-content { display: none; padding: 10px; }
.reference-accordion.open .reference-content { display: block; }
.reference-criterion + .reference-criterion { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); }
.reference-criterion-name { font-size: 13px; font-weight: 700; color: var(--accent); margin: 0 0 7px 2px; }
.reference-criterion-name .en-part { font-size: 0.85em; color: var(--text-tertiary); font-weight: 400; margin-left: 3px; }
.reference-current { margin-left: auto; background: var(--c); color: white; padding: 2px 6px; font-size: 10px; border-radius: 4px; font-weight: 600; }
.excluded-badge { margin-left: 5px; padding: 1px 6px; border-radius: 999px; background: #7d7d7d; color: white; font-size: 10px; font-weight: 600; }
.is-excluded { background: #f6f4f0; color: var(--text-tertiary); }
.is-excluded .criterion-name .zh-part,
.is-excluded .criterion-name .en-part { color: var(--text-tertiary); }
.is-excluded .comment-input { background: #ece8e2; }
.excluded-note { margin-top: 8px; font-size: 12px; color: var(--text-tertiary); font-style: italic; }
.aural-toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.aural-toggle input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.toggle-track { width: 32px; height: 18px; display: inline-flex; align-items: center; padding: 2px; border-radius: 999px; background: #a6a19a; transition: background 0.18s ease; }
.toggle-thumb { width: 14px; height: 14px; border-radius: 50%; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.18); transition: transform 0.18s ease; }
.aural-toggle input:checked + .toggle-track { background: var(--green); }
.aural-toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(14px); }
.aural-toggle input:focus-visible + .toggle-track { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.criteria-note { margin: -1px 0 12px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--bg-soft); color: var(--text-secondary); font-size: 13px; line-height: 1.55; border-radius: 0 6px 6px 0; }

@media (max-width: 600px) {
  .score-control { width: 100%; justify-content: flex-start; }
  .tech-control-wrap { width: 100%; justify-content: flex-start; gap: 8px; }
  .score-control .score-btn { width: 32px; height: 32px; }
  .score-divider { display: none; }
}
@media (max-width: 390px) {
  .score-control { gap: 4px; }
  .score-control .score-btn { width: 30px; height: 30px; }
  .score-adjust { width: 28px; height: 28px; }
  .score-input { width: 46px; height: 28px; }
}

.selected-band-reference { margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--border-strong); }
.selected-band-reference:first-child { margin-top: 0; padding-top: 0; border-top: none; }
.selected-band-reference strong { display: block; color: var(--text-primary); font-size: 12px; margin-bottom: 2px; }
.selected-band-reference strong .en-part { font-size: 0.9em; color: var(--text-tertiary); font-weight: 500; margin-left: 3px; }
.selected-band-reference .desc-zh,
.selected-band-reference .desc-en { display: block; }

/* ====== Detail Panel ====== */
.detail-panel {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.25s ease, margin 0.25s ease, padding 0.25s ease;
  margin-top: 0;
  padding: 0 12px;
  border-radius: 8px;
  background: var(--bg-soft);
  border-left: 4px solid var(--c, var(--accent));
}
.detail-panel.expanded {
  max-height: 320px;
  margin-top: 8px;
  padding: 10px 12px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.detail-panel .band-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 13px;
  flex-wrap: wrap;
}
.detail-panel .band-num {
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  color: var(--c, var(--accent));
  font-size: 18px;
}
.detail-panel .band-name { font-weight: 600; color: var(--text-primary); }
.detail-panel .band-name .en-part { font-size: 0.85em; opacity: 0.7; margin-left: 3px; font-weight: 500; }
.detail-panel .band-range {
  font-size: 12px;
  color: var(--text-tertiary);
  background: white;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.detail-panel .band-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
}
.detail-panel .band-desc .desc-zh { display: block; }
.detail-panel .band-desc .desc-en {
  display: block;
  font-size: 0.92em;
  color: var(--text-tertiary);
  font-style: italic;
  margin-top: 2px;
}
.lang-en .detail-panel .band-name .en-part { opacity: 1; }
.lang-en .detail-panel .band-desc .desc-en { color: var(--text-secondary); font-style: normal; }
.lang-en .detail-panel .band-desc .desc-zh { display: none; }
.lang-en .detail-panel .band-desc .desc-en { font-size: 1em; margin-top: 0; }

/* ====== Comment Input ====== */
.comment-input {
  width: 100%;
  margin-top: 8px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg-soft);
  color: var(--text-primary);
  font-size: 16px;
  font-family: inherit;
  transition: all 0.15s ease;
}
.comment-input:focus {
  outline: none;
  border-color: var(--accent);
  background: white;
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.comment-input::placeholder {
  color: var(--text-tertiary);
  font-size: 13px;
}

/* ====== Extra Section (Perf as Whole / Tech Tests) ====== */
.extra-card {
  background: linear-gradient(135deg, #FFFBF2 0%, #FFF8E8 100%);
  border: 1px solid var(--accent-soft);
}
.extra-card .card-title { color: var(--accent); }

/* ====== Summary ====== */
.summary-card {
  background: linear-gradient(135deg, #1A1A1A 0%, #2A2620 100%);
  color: white;
  border: none;
  box-shadow: var(--shadow-lg);
}
.summary-card .card-title { color: white; }
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.summary-cell {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 10px 12px;
  text-align: center;
}
.summary-cell .label {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.6);
  font-weight: 500;
  margin-bottom: 4px;
}
.summary-cell .label .en-part { opacity: 0.8; margin-left: 2px; }
.summary-cell .value {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 600;
  color: white;
}
.summary-cell .value .denom { color: rgba(255, 255, 255, 0.5); font-size: 0.75em; }

.summary-total-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding-top: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.15);
}
.summary-total {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.85);
}
.summary-total .grand-num {
  font-size: 28px;
  font-weight: 700;
  color: white;
  margin: 0 4px;
}
.summary-total .grand-denom { color: rgba(255, 255, 255, 0.55); font-size: 0.85em; }

.result-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 999px;
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
  font-size: 15px;
  background: var(--pill-bg, #555);
  color: white;
  border: 2px solid var(--pill-border, transparent);
}
.result-pill .en-part { font-size: 0.85em; opacity: 0.85; margin-left: 4px; font-weight: 500; }

.action-buttons {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.action-btn {
  flex: 1;
  min-width: 140px;
  padding: 11px 14px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.18s ease;
  border: 1px solid transparent;
}
.action-btn .icon { font-size: 16px; }
.action-btn .en-part { font-size: 0.85em; opacity: 0.85; margin-left: 3px; }
.btn-primary {
  background: var(--accent);
  color: white;
}
.btn-primary:active { transform: scale(0.97); }
.btn-secondary {
  background: white;
  color: var(--text-primary);
  border-color: var(--border-strong);
}
.btn-secondary:active { transform: scale(0.97); }

/* ====== Sticky Summary (Criteria Page) ====== */
.criteria-sticky {
  position: sticky;
  top: 86px;
  z-index: 90;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: saturate(180%) blur(8px);
  -webkit-backdrop-filter: saturate(180%) blur(8px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-md);
}
.criteria-sticky-grid {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 12px;
}
.cs-cell {
  background: var(--bg-soft);
  border-radius: 6px;
  padding: 5px 9px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 60px;
}
.cs-cell .lbl { color: var(--text-tertiary); font-size: 10px; font-weight: 500; }
.cs-cell .val { font-family: 'Noto Serif SC', serif; font-weight: 600; color: var(--text-primary); }

/* ============================================================
   UTILITIES & CALCULATIONS
============================================================ */

function t(obj) {
  if (!obj) return '';
  return state.lang === 'en' ? (obj.en || obj.zh || '') : (obj.zh || obj.en || '');
}

function getModeData() { return CRITERIA_DATA[state.mode]; }

function getResultBands() {
  return state.mode === 'practical' && !state.practical.extra.auralEnabled
    ? NO_AURAL_RESULT_BANDS
    : STANDARD_RESULT_BANDS;
}

function getResultBand(total) {
  return getResultBands().find(b => total >= b.threshold) || getResultBands()[getResultBands().length - 1];
}

function getGrandMax() {
  return state.mode === 'practical' && !state.practical.extra.auralEnabled ? 132 : 150;
}

function calcPieceTotal(piece) {
  return clampInt(piece.score, 0, 30);
}

function calcTechTotal() {
  const extra = state.practical.extra;
  let total = clampInt(extra.scores.scales, 0, 21) + clampInt(extra.scores.sightreading, 0, 21);
  if (extra.auralEnabled) total += clampInt(extra.scores.aural, 0, 18);
  return total;
}

function getExtraMax() {
  if (state.mode === 'performance') return 30;
  return state.practical.extra.auralEnabled ? 60 : 42;
}

function calcGrandTotal() {
  const st = state[state.mode];
  let total = st.pieces.reduce((sum, piece) => sum + calcPieceTotal(piece), 0);
  total += state.mode === 'performance'
    ? clampInt(st.extra.scores.performance, 0, 30)
    : calcTechTotal();
  return { total, max: getGrandMax() };
}

function clampInt(value, min, max) {
  const parsed = Number.parseInt(value, 10);
  if (Number.isNaN(parsed)) return min;
  return Math.min(max, Math.max(min, parsed));
}

function parseRange(range) {
  const values = String(range || '').replace(/[–—]/g, '-').match(/(\d+)\s*-\s*(\d+)/);
  return values ? { min: Number(values[1]), max: Number(values[2]) } : null;
}

function inferBand(score, bands) {
  if (!score) return 0;
  for (const band of bands) {
    const bounds = parseRange(band.range);
    if (bounds && score >= bounds.min && score <= bounds.max) return band.score;
  }
  return 0;
}

function getTarget(target) {
  const pieceMatch = String(target).match(/^piece-(\d+)$/);
  if (pieceMatch) {
    const piece = state[state.mode].pieces[Number(pieceMatch[1])];
    return {
      max: 30,
      midpoints: PIECE_MIDPOINTS,
      referenceBands: DIRECT_30_BANDS,
      get score() { return piece.score; },
      set score(value) { piece.score = clampInt(value, 0, 30); },
      get band() { return piece.band; },
      set band(value) { piece.band = clampInt(value, 0, 5); }
    };
  }
  if (target === 'extra-performance') {
    const extra = state.performance.extra;
    return {
      max: 30,
      midpoints: PIECE_MIDPOINTS,
      referenceBands: DIRECT_30_BANDS,
      get score() { return extra.scores.performance; },
      set score(value) { extra.scores.performance = clampInt(value, 0, 30); },
      get band() { return extra.bands.performance; },
      set band(value) { extra.bands.performance = clampInt(value, 0, 5); }
    };
  }
  const techMatch = String(target).match(/^tech-(scales|sightreading|aural)$/);
  if (techMatch) {
    const id = techMatch[1];
    const criterion = CRITERIA_DATA.practical.extra.criteria.find(c => c.id === id);
    const extra = state.practical.extra;
    return {
      max: criterion.max,
      midpoints: id === 'aural' ? AURAL_18_MIDPOINTS : TECH_21_MIDPOINTS,
      referenceBands: criterion.bands,
      get score() { return extra.scores[id]; },
      set score(value) { extra.scores[id] = clampInt(value, 0, criterion.max); },
      get band() { return extra.bands[id]; },
      set band(value) { extra.bands[id] = clampInt(value, 0, 5); }
    };
  }
  return null;
}

function getDisplayBand(assessment) {
  if (!assessment || !assessment.score) return 0;
  return inferBand(assessment.score, assessment.referenceBands);
}

function bandName(band) {
  return BAND_NAMES[band] || null;
}

function localizedBandLabel(band) {
  const name = bandName(band);
  if (!name) return '';
  return state.lang === 'zh' ? `${name.zh} ${name.en}` : name.en;
}

function getReferenceOpen(key) { return Boolean(state.ui.referenceOpen[key]); }

function setReferenceOpen(key, open) { state.ui.referenceOpen[key] = Boolean(open); }

/* ============================================================
   RENDERING — SCORING PAGE
============================================================ */

function renderScoring() {
  const md = getModeData();
  const container = document.getElementById('scoring-content');
  let html = '';
  for (let i = 0; i < md.pieces.count; i++) html += renderPieceCard(i, md);
  html += renderExtraCard(md);
  container.innerHTML = html;
  renderSummary();
}

function renderPieceCard(idx, md) {
  const piece = state[state.mode].pieces[idx];
  const target = `piece-${idx}`;
  const assessment = getTarget(target);
  const pieceLabelZh = ['一', '二', '三', '四'][idx] || String(idx + 1);
  const referenceKey = `${target}-reference`;
  const subtitle = { zh: '整體曲目分數', en: 'Overall Piece Mark' };
  const commentPlaceholder = state.lang === 'zh' ? '教師評語（可選） Teacher comments (optional)' : 'Teacher comments (optional)';

  return `<div class="piece-card" data-piece-idx="${idx}">
    <div class="piece-header">
      <div class="piece-num">${pieceLabelZh}</div>
      <input type="text" class="piece-name-input" data-piece-idx="${idx}"
             placeholder="${state.lang === 'en' ? 'Piece name' : '曲名 Piece name'}"
             value="${escapeAttr(piece.name)}">
      <div class="piece-subtotal">
        <span class="zh-part">小計</span><span class="en-part">Subtotal</span>
        <span class="num">${calcPieceTotal(piece)}</span><span class="denom">/30</span>
      </div>
    </div>
    <div class="criterion direct-assessment">
      <div class="criterion-head">
        <div class="criterion-name"><span class="zh-part">${subtitle.zh}</span><span class="en-part">${subtitle.en}</span></div>
        ${renderScoreControl(assessment, target)}
      </div>
      ${renderSelectedBandDetail(assessment, md.pieces.criteria)}
      ${renderReferenceAccordion(md.pieces.criteria, referenceKey, getDisplayBand(assessment), 'pieces')}
      <input type="text" class="comment-input" data-comment-scope="piece" data-piece-idx="${idx}"
             placeholder="${escapeAttr(commentPlaceholder)}" value="${escapeAttr(piece.comments)}">
    </div>
  </div>`;
}

function renderExtraCard(md) {

}

  const referenceKey = 'extra-performance-reference';

    </h2>
    <div class="criterion direct-assessment">
      <div class="criterion-head">
        <div class="criterion-name"><span class="zh-part">直接評分</span><span class="en-part">Direct Mark</span></div>
        ${renderScoreControl(assessment, target)}
      </div>
      ${renderSelectedBandDetail(assessment, md.extra.criteria)}

function renderPracticalExtraCard(md) {

    <h2 class="card-title">
      <span class="badge-star">${md.extra.symbol}</span>

    </h2>`;

    html += renderTechAssessment(criterion, criterion.id === 'aural' && !enabled);
  });

}

function renderTechAssessment(criterion, disabled) {
  const target = `tech-${criterion.id}`;
  const assessment = getTarget(target);
  const referenceKey = `${target}-reference`;
  const comment = state.practical.extra.comments[criterion.id] || '';
  const commentPlaceholder = state.lang === 'zh' ? '教師評語（可選） Teacher comments (optional)' : 'Teacher comments (optional)';
  const auralToggle = criterion.id === 'aural' ? `
    <label class="aural-toggle">
      <input type="checkbox" class="aural-enabled-input" ${state.practical.extra.auralEnabled ? 'checked' : ''}>
      <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
      <span class="toggle-label"><span class="zh-part">計入聽覺</span><span class="en-part">Include Aural</span></span>
    </label>` : '';
  const excluded = disabled ? `<span class="excluded-badge"><span class="zh-part">不計</span><span class="en-part">Excluded</span></span>` : '';

  return `<div class="criterion direct-assessment ${disabled ? 'is-excluded' : ''}">
    <div class="criterion-head">
      <div class="criterion-name">
        <span class="zh-part">${criterion.zh}</span><span class="en-part">${criterion.en}</span>
        <span class="criterion-max">/${criterion.max}</span>${excluded}
      </div>
      <div class="tech-control-wrap">${auralToggle}${renderScoreControl(assessment, target, disabled)}</div>
    </div>
    ${disabled ? '<div class="excluded-note"><span class="zh-part">此項分數不計入技術測試小計或總分。</span><span class="en-part">This mark is excluded from the technical-test subtotal and grand total.</span></div>' : renderSelectedBandDetail(assessment, [criterion])}
    ${renderReferenceAccordion([criterion], referenceKey, getDisplayBand(assessment), 'tech', disabled)}
    <input type="text" class="comment-input" data-comment-scope="tech" data-item-id="${criterion.id}" ${disabled ? 'disabled' : ''}
           placeholder="${escapeAttr(commentPlaceholder)}" value="${escapeAttr(comment)}">
  </div>`;
}

function renderScoreControl(assessment, target, disabled) {
  const currentBand = getDisplayBand(assessment);
  let html = `<div class="score-control" data-score-target="${target}">`;
  for (let score = 5; score >= 1; score--) {
    const color = SCORE_COLORS[score];
    const selected = currentBand === score ? 'selected' : '';
    html += `<button type="button" class="score-btn ${selected}" data-band="${score}" style="--c:${color}" ${disabled ? 'disabled' : ''} aria-label="Band ${score}">${score}</button>`;
  }
  html += `<span class="score-divider"></span>
    <button type="button" class="score-adjust" data-adjust="-1" ${disabled || assessment.score <= 0 ? 'disabled' : ''} aria-label="Decrease mark">−</button>
    <input type="number" class="score-input" data-score-target="${target}" min="0" max="${assessment.max}" step="1" value="${assessment.score}" ${disabled ? 'disabled' : ''} aria-label="Mark out of ${assessment.max}">
    <button type="button" class="score-adjust" data-adjust="1" ${disabled || assessment.score >= assessment.max ? 'disabled' : ''} aria-label="Increase mark">+</button>
  </div>`;
  return html;
}

function renderSelectedBandDetail(assessment, criteria) {
  const selectedBand = getDisplayBand(assessment);
  if (!selectedBand) return '<div class="detail-panel"></div>';
  const ref = assessment.referenceBands.find(b => b.score === selectedBand) || { range: '' };
  const label = bandName(selectedBand);
  const descriptions = (criteria || []).map(criterion => {
    const criterionBand = criterion.bands.find(band => band.score === selectedBand);
    if (!criterionBand) return '';
    return `<div class="selected-band-reference">
      <strong><span class="zh-part">${criterion.zh}</span><span class="en-part">${criterion.en}</span></strong>
      <span class="desc-zh">${criterionBand.zh}</span><span class="desc-en">${criterionBand.en}</span>
    </div>`;
  }).join('');
  return `<div class="detail-panel expanded" style="--c:${SCORE_COLORS[selectedBand]}">
    <div class="band-line">
      <span class="band-num">${selectedBand}</span>
      <span class="band-name"><span class="zh-part">${label.zh}</span><span class="en-part">${label.en}</span></span>
      <span class="band-range">${ref.range}</span>
    </div>
    <div class="band-desc">${descriptions || `<span class="desc-zh">目前分數落在此評分區間。</span><span class="desc-en">The current mark falls in this band.</span>`}</div>
  </div>`;
}

function renderReferenceAccordion(criteria, referenceKey, selectedBand, source, disabled) {
  const open = getReferenceOpen(referenceKey);
  const heading = state.lang === 'zh' ? '評分參考（不獨立打分） Marking reference (not separately scored)' : 'Marking reference (not separately scored)';
  let html = `<div class="reference-accordion ${open ? 'open' : ''}">
    <button type="button" class="reference-toggle" data-reference-key="${referenceKey}" aria-expanded="${open}">
      <span>${heading}</span><span class="reference-chevron">${open ? '−' : '+'}</span>
    </button>
    <div class="reference-content">`;
  criteria.forEach(criterion => {
    html += `<div class="reference-criterion">
      <div class="reference-criterion-name"><span class="zh-part">${criterion.zh}</span><span class="en-part">${criterion.en}</span></div>`;
    criterion.bands.forEach(band => {
      const active = !disabled && band.score === selectedBand ? 'has-selection' : '';
      html += `<div class="band-row ${active}" style="--c:${SCORE_COLORS[band.score]}">
        <div class="band-row-top">
          <span class="b-num">${band.score}</span>
          <span class="b-name"><span class="zh-part">${BAND_NAMES[band.score].zh}</span><span class="en-part">${BAND_NAMES[band.score].en}</span></span>
          <span class="b-range">${band.range}</span>
          ${active ? '<span class="reference-current"><span class="zh-part">目前</span><span class="en-part">Current</span></span>' : ''}
        </div>
        <div class="b-desc"><span class="desc-zh">${band.zh}</span><span class="desc-en">${band.en}</span></div>
      </div>`;
    });
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

/* ============================================================
   SCORING INTERACTIONS
============================================================ */

function attachScoringListeners() {
  document.addEventListener('click', event => {
    const bandButton = event.target.closest('.score-btn[data-band]');
    if (bandButton && !bandButton.disabled) {
      const control = bandButton.closest('.score-control');
      const target = control && control.dataset.scoreTarget;
      const assessment = getTarget(target);
      const band = Number(bandButton.dataset.band);
      if (assessment) {
        assessment.band = band;
        assessment.score = assessment.midpoints[band];
        setReferenceOpen(`${target}-reference`, true);
        renderAll();
      }
      return;
    }

    const adjustButton = event.target.closest('.score-adjust');
    if (adjustButton && !adjustButton.disabled) {
      const control = adjustButton.closest('.score-control');
      const target = control && control.dataset.scoreTarget;
      const assessment = getTarget(target);
      if (assessment) {
        assessment.score = assessment.score + Number(adjustButton.dataset.adjust);
        renderAll();
      }
      return;
    }

    const referenceToggle = event.target.closest('.reference-toggle');
    if (referenceToggle) {
      const key = referenceToggle.dataset.referenceKey;
      setReferenceOpen(key, !getReferenceOpen(key));
      renderScoring();
    }
  });

  document.addEventListener('input', event => {
    const input = event.target;
    if (input.classList.contains('score-input')) {
      const assessment = getTarget(input.dataset.scoreTarget);
      if (assessment) {
        assessment.score = clampInt(input.value, 0, assessment.max);
        refreshCalculatedViews();
      }
      return;
    }
    if (input.classList.contains('piece-name-input')) {
      state[state.mode].pieces[Number(input.dataset.pieceIdx)].name = input.value;
      return;
    }
    if (input.classList.contains('info-input')) {
      state.info[input.dataset.field] = input.value;
      return;
    }
    if (input.classList.contains('comment-input')) {
      const scope = input.dataset.commentScope;
      if (scope === 'piece') {
        state[state.mode].pieces[Number(input.dataset.pieceIdx)].comments = input.value;
      } else if (scope === 'extra-performance') {
        state.performance.extra.comments = input.value;
      } else if (scope === 'tech') {
        state.practical.extra.comments[input.dataset.itemId] = input.value;
      }
    }
  });

  document.addEventListener('change', event => {
    const input = event.target;
    if (input.classList.contains('score-input')) {
      const assessment = getTarget(input.dataset.scoreTarget);
      if (assessment) assessment.score = clampInt(input.value, 0, assessment.max);
      renderAll();
      return;
    }
    if (input.classList.contains('aural-enabled-input')) {
      state.practical.extra.auralEnabled = input.checked;
      renderAll();
    }
  });
}

    : { zh: 'C. 總成績等級', en: 'Section C: Overall Result Bands' };

function renderCriterionReference(criterion, scope) {
  let selectedBand = 0;
  let tagsHtml = '';
  if (scope === 'pieces') {
    state[state.mode].pieces.forEach((piece, index) => {
      const assessment = getTarget(`piece-${index}`);
      if (getDisplayBand(assessment)) selectedBand = selectedBand || getDisplayBand(assessment);
    });
  }
  let html = `<div class="criteria-subsection"><div class="criteria-subsection-title"><span class="zh-part">${criterion.zh}</span><span class="en-part">${criterion.en}</span>`;
  if (criterion.max) html += `<span class="extra-info">(max ${criterion.max}, pass ${criterion.pass})</span>`;
  else html += `<span class="extra-info">(reference only /30)</span>`;
  html += '</div>';

  criterion.bands.forEach(band => {
    let tags = '';
    if (scope === 'pieces') {
      state[state.mode].pieces.forEach((piece, index) => {
        const assessment = getTarget(`piece-${index}`);
        if (getDisplayBand(assessment) === band.score) tags += `<span class="piece-tag">P${index + 1}</span>`;
      });
    } else if (scope === 'performance-extra') {
      if (getDisplayBand(getTarget('extra-performance')) === band.score) tags = '<span class="piece-tag">★</span>';
    } else if (scope === 'tech' && !(criterion.id === 'aural' && !state.practical.extra.auralEnabled)) {
      if (getDisplayBand(getTarget(`tech-${criterion.id}`)) === band.score) tags = '<span class="piece-tag">★</span>';
    }
    const selectedClass = tags ? 'has-selection' : '';
    html += `<div class="band-row ${selectedClass}" style="--c:${SCORE_COLORS[band.score]}">
      <div class="band-row-top"><span class="b-num">${band.score}</span>
        <span class="b-name"><span class="zh-part">${BAND_NAMES[band.score].zh}</span><span class="en-part">${BAND_NAMES[band.score].en}</span></span>
        <span class="b-range">${band.range}</span><span class="piece-tags">${tags}</span>
      </div>
      <div class="b-desc"><span class="desc-zh">${band.zh}</span><span class="desc-en">${band.en}</span></div>
    </div>`;
  });
  return html + '</div>';
}

/* ============================================================
   OUTPUT TEXT GENERATION
============================================================ */

function outputBandText(assessment) {
  const band = getDisplayBand(assessment);
  return band ? ` — ${localizedBandLabel(band)}` : '';
}

function generateOutputText() {
  const md = getModeData();
  const isZh = state.lang === 'zh';
  const Lb = (zh, en) => isZh ? `${zh} ${en}` : en;
  const Lp = (zh, en) => isZh ? `${zh} | ${en}` : en;
  const sep = '━━━━━━━━━━━━━━━━━━';
  let out = `ABRSM ${Lb(md.name.zh, md.name.en)} ${Lb('評分表', 'Scoring Sheet')}\n${sep}\n`;
  out += `${Lp('學生', 'Student')}: ${state.info.student || '___'}\n${Lp('日期', 'Date')}: ${state.info.date || '___'}\n${Lp('級別', 'Grade')}: ${state.info.grade || '___'}\n${Lp('教師', 'Teacher')}: ${state.info.teacher || '___'}\n${sep}\n\n`;
  for (let i = 0; i < md.pieces.count; i++) {
    const piece = state[state.mode].pieces[i];
    const assessment = getTarget(`piece-${i}`);
    const name = piece.name || (isZh ? '（未填）' : '(untitled)');
    out += `${isZh ? `曲目${['一', '二', '三', '四'][i]}` : `Piece ${i + 1}`}: ${name}\n`;
    out += `  ${Lb('整體分數', 'Overall mark')}: ${assessment.score}/30${assessment.score ? outputBandText(assessment) : ` — ${Lb('未評分', 'Not Scored')}`}\n`;
    if (piece.comments) out += `  ${Lb('評語', 'Comments')}: ${piece.comments}\n`;
    out += '\n';
  }
  if (state.mode === 'performance') {
    const assessment = getTarget('extra-performance');
    out += `${md.extra.symbol} ${Lb(md.extra.title.zh, md.extra.title.en)}\n`;
    out += `  ${Lb('分數', 'Mark')}: ${assessment.score}/30${assessment.score ? outputBandText(assessment) : ` — ${Lb('未評分', 'Not Scored')}`}\n`;
    if (state.performance.extra.comments) out += `  ${Lb('評語', 'Comments')}: ${state.performance.extra.comments}\n`;
    out += `  ${Lb('小計', 'Subtotal')}: ${assessment.score}/30\n\n`;
  } else {
    out += `${md.extra.symbol} ${Lb(md.extra.title.zh, md.extra.title.en)}\n`;
    md.extra.criteria.forEach(criterion => {
      const assessment = getTarget(`tech-${criterion.id}`);
      const excluded = criterion.id === 'aural' && !state.practical.extra.auralEnabled;
      if (excluded) {
        out += `  ${Lb(criterion.zh, criterion.en)}: ${Lb('不計入總分', 'Excluded from total')}\n`;
      } else {
        out += `  ${Lb(criterion.zh, criterion.en)}: ${assessment.score}/${assessment.max}${assessment.score ? outputBandText(assessment) : ` — ${Lb('未評分', 'Not Scored')}`}\n`;
        if (state.practical.extra.comments[criterion.id]) out += `    ${Lb('評語', 'Comments')}: ${state.practical.extra.comments[criterion.id]}\n`;
      }
    });
    out += `  ${Lb('技術測試小計', 'Technical-tests subtotal')}: ${calcTechTotal()}/${getExtraMax()}\n\n`;
  }
  const { total, max } = calcGrandTotal();
  const result = total === 0 ? null : getResultBand(total);
  out += `${sep}\n${Lb('總分', 'Grand Total')}: ${total}/${max}\n${Lb('等級', 'Result')}: ${result ? (isZh ? `${result.zh} ${result.en}` : result.en) : Lb('未評分', 'Not Scored')}\n${sep}\n`;
  return out;
}

function generatePdfHtml() {
  const md = getModeData();
  const isZh = state.lang === 'zh';
  const Lb = (zh, en) => isZh ? `${zh} ${en}` : en;
  const Lp = (zh, en) => isZh ? `${zh} | ${en}` : en;
  const notScored = Lb('未評分', 'Not Scored');
  let html = `<div class="pa-title">ABRSM ${Lb(md.name.zh, md.name.en)} ${Lb('評分表', 'Scoring Sheet')}</div>`;
  html += `<div class="pa-line">${Lp('學生', 'Student')}: ${escapeHtml(state.info.student) || '___'}</div><div class="pa-line">${Lp('日期', 'Date')}: ${escapeHtml(state.info.date) || '___'}</div><div class="pa-line">${Lp('級別', 'Grade')}: ${escapeHtml(state.info.grade) || '___'}</div><div class="pa-line">${Lp('教師', 'Teacher')}: ${escapeHtml(state.info.teacher) || '___'}</div><div class="pa-divider"></div>`;
  for (let i = 0; i < md.pieces.count; i++) {
    const piece = state[state.mode].pieces[i];
    const assessment = getTarget(`piece-${i}`);
    html += `<div class="pa-section">${isZh ? `曲目${['一', '二', '三', '四'][i]}` : `Piece ${i + 1}`}: ${escapeHtml(piece.name || (isZh ? '（未填）' : '(untitled)'))}</div>`;
    html += `<div class="pa-line">${Lb('整體分數', 'Overall mark')}: ${assessment.score}/30${assessment.score ? escapeHtml(outputBandText(assessment)) : ` — ${notScored}`}</div>`;
    if (piece.comments) html += `<div class="pa-line">${Lb('評語', 'Comments')}: ${escapeHtml(piece.comments)}</div>`;
  }
  if (state.mode === 'performance') {
    const assessment = getTarget('extra-performance');
    html += `<div class="pa-section">${md.extra.symbol} ${Lb(md.extra.title.zh, md.extra.title.en)}</div><div class="pa-line">${Lb('分數', 'Mark')}: ${assessment.score}/30${assessment.score ? escapeHtml(outputBandText(assessment)) : ` — ${notScored}`}</div>`;
    if (state.performance.extra.comments) html += `<div class="pa-line">${Lb('評語', 'Comments')}: ${escapeHtml(state.performance.extra.comments)}</div>`;
    html += `<div class="pa-line"><strong>${Lb('小計', 'Subtotal')}: ${assessment.score}/30</strong></div>`;
  } else {
    html += `<div class="pa-section">${md.extra.symbol} ${Lb(md.extra.title.zh, md.extra.title.en)}</div>`;
    md.extra.criteria.forEach(criterion => {
      const assessment = getTarget(`tech-${criterion.id}`);
      const excluded = criterion.id === 'aural' && !state.practical.extra.auralEnabled;
      if (excluded) html += `<div class="pa-line">${Lb(criterion.zh, criterion.en)}: ${Lb('不計入總分', 'Excluded from total')}</div>`;
      else {
        html += `<div class="pa-line">${Lb(criterion.zh, criterion.en)}: ${assessment.score}/${assessment.max}${assessment.score ? escapeHtml(outputBandText(assessment)) : ` — ${notScored}`}</div>`;
        if (state.practical.extra.comments[criterion.id]) html += `<div class="pa-line">${Lb('評語', 'Comments')}: ${escapeHtml(state.practical.extra.comments[criterion.id])}</div>`;
      }
    });
    html += `<div class="pa-line"><strong>${Lb('技術測試小計', 'Technical-tests subtotal')}: ${calcTechTotal()}/${getExtraMax()}</strong></div>`;
  }
  const { total, max } = calcGrandTotal();
  const result = total === 0 ? null : getResultBand(total);
  const resultLabel = result ? (isZh ? `${result.zh} ${result.en}` : result.en) : notScored;
  html += `<div class="pa-total"><strong>${Lb('總分', 'Grand Total')}: ${total}/${max}</strong></div><div class="pa-total"><strong>${Lb('等級', 'Result')}: ${resultLabel}</strong></div>`;
  return html;
}

/* ============================================================
   MODALS, LANGUAGE, MODE, AND INITIALIZATION
============================================================ */

function openCopyModal() {
  const text = generateOutputText();
  const ta = document.getElementById('copy-textarea');
  ta.value = text;
  document.getElementById('copy-modal').classList.add('open');
  setTimeout(() => {
    ta.focus();
    ta.select();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => {});
  }, 50);
}

function openPdfModal() {
  document.getElementById('pdf-content').innerHTML = generatePdfHtml();
  document.getElementById('pdf-modal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function applyLang(lang) {
  state.lang = lang;
  document.body.classList.toggle('lang-zh', lang === 'zh');
  document.body.classList.toggle('lang-en', lang === 'en');
  document.querySelectorAll('.lang-btn').forEach(button => button.classList.toggle('active', button.dataset.lang === lang));
  renderAll();
}

function applyMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.mode === mode));
  renderAll();
}

function applySub(sub) {
  state.sub = sub;
  document.querySelectorAll('.sub-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.sub === sub));
  document.getElementById('page-scoring').classList.toggle('active', sub === 'scoring');
  document.getElementById('page-criteria').classList.toggle('active', sub === 'criteria');
  if (sub === 'criteria') renderCriteriaPage();
}

function renderAll() {
  renderScoring();
  if (state.sub === 'criteria') renderCriteriaPage();
}

function escapeHtml(value) {
  if (value == null) return '';
  return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escapeAttr(value) {
  if (value == null) return '';
  return String(value).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function init() {
  document.querySelectorAll('.mode-tab').forEach(tab => tab.addEventListener('click', () => applyMode(tab.dataset.mode)));
  document.querySelectorAll('.sub-tab').forEach(tab => tab.addEventListener('click', () => applySub(tab.dataset.sub)));
  document.querySelectorAll('.lang-btn').forEach(button => button.addEventListener('click', () => applyLang(button.dataset.lang)));
  document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => closeModal(button.dataset.close)));
  document.querySelectorAll('.modal-overlay').forEach(overlay => overlay.addEventListener('click', event => {
    if (event.target === overlay) overlay.classList.remove('open');
  }));
  document.getElementById('print-btn').addEventListener('click', () => {
    const printArea = document.getElementById('print-area');
    printArea.innerHTML = generatePdfHtml();
    document.getElementById('pdf-modal').classList.remove('open');
    printArea.style.display = 'block';
    setTimeout(() => {
      window.print();
      setTimeout(() => { printArea.style.display = ''; }, 500);
    }, 100);
  });
  attachScoringListeners();
  renderAll();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

/* End of scoring logic */

</script>
