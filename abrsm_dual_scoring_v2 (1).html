<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ABRSM 評分表 / Scoring Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ====== Reset & Base ====== */
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding: 0;
}
html, body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #FAF7F2;
  color: #1A1A1A;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}
body { overscroll-behavior-y: none; }
button {
  font-family: inherit;
  font-size: inherit;
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
  touch-action: manipulation;
}
input, textarea, select {
  font-family: inherit;
  font-size: 16px; /* Prevents iOS zoom */
  -webkit-appearance: none;
  appearance: none;
}
h1, h2, h3, h4 {
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
  line-height: 1.3;
  color: #1A1A1A;
}

/* ====== Variables ====== */
:root {
  --bg: #FAF7F2;
  --bg-card: #FFFFFF;
  --bg-soft: #F5F1E8;
  --text-primary: #1A1A1A;
  --text-secondary: #5C5C5C;
  --text-tertiary: #8A8A8A;
  --border: #E8E0D3;
  --border-strong: #C9BFA8;
  --accent: #B8941F;
  --accent-soft: #F5E9C8;
  --gold: #B8941F;
  --silver: #6B7B8A;
  --green: #4A7C59;
  --orange: #B8814A;
  --red: #A8484E;
  --shadow-sm: 0 1px 3px rgba(60, 40, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(60, 40, 0, 0.06);
  --shadow-lg: 0 8px 24px rgba(60, 40, 0, 0.10);
}

/* ====== Layout ====== */
.container {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 16px 32px;
}

/* ====== Top Navigation ====== */
.top-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.mode-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-soft);
  border-radius: 10px;
  padding: 3px;
  flex: 1;
  max-width: 460px;
}
.mode-tab {
  flex: 1;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.18s ease;
  text-align: center;
  line-height: 1.2;
}
.mode-tab .zh-part { font-weight: 600; }
.mode-tab .en-part { font-size: 0.78em; opacity: 0.7; margin-left: 3px; }
.mode-tab.active {
  background: white;
  color: var(--accent);
  box-shadow: var(--shadow-sm);
}
.lang-toggle {
  display: flex;
  gap: 2px;
  background: var(--bg-soft);
  border-radius: 8px;
  padding: 3px;
  flex-shrink: 0;
}
.lang-btn {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: all 0.18s ease;
}
.lang-btn.active {
  background: var(--accent);
  color: white;
}

/* ====== Sub Navigation ====== */
.sub-nav {
  position: sticky;
  top: 49px;
  z-index: 99;
  background: rgba(250, 247, 242, 0.96);
  backdrop-filter: saturate(180%) blur(8px);
  -webkit-backdrop-filter: saturate(180%) blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
}
.sub-tabs {
  display: flex;
  gap: 6px;
  max-width: 920px;
  margin: 0 auto;
}
.sub-tab {
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.18s ease;
}
.sub-tab .zh-part { font-weight: 600; }
.sub-tab .en-part { font-size: 0.85em; opacity: 0.7; margin-left: 3px; }
.sub-tab.active {
  background: var(--accent-soft);
  color: var(--accent);
}

/* ====== Page (sections) ====== */
.page {
  display: none;
  padding-top: 16px;
}
.page.active { display: block; }

/* ====== Card ====== */
.card {
  background: var(--bg-card);
  border-radius: 14px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 18px;
  margin-bottom: 14px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title .zh-part { font-weight: 700; }
.card-title .en-part {
  font-size: 0.78em;
  opacity: 0.6;
  font-weight: 500;
  font-family: 'Noto Sans SC', sans-serif;
}
.card-title .badge-star {
  color: var(--accent);
  font-size: 1.1em;
  margin-right: 2px;
}

/* ====== Info Grid ====== */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 12px;
}
.info-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.info-field .label {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}
.info-field .label .en-part {
  font-size: 0.92em;
  opacity: 0.7;
  margin-left: 3px;
}
.info-input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg-soft);
  color: var(--text-primary);
  font-size: 16px;
  transition: all 0.15s ease;
}
.info-input:focus {
  outline: none;
  border-color: var(--accent);
  background: white;
  box-shadow: 0 0 0 3px var(--accent-soft);
}

/* ====== Piece Card ====== */
.piece-card {
  background: var(--bg-card);
  border-radius: 14px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
  overflow: hidden;
}
.piece-header {
  padding: 14px 16px 8px;
  border-bottom: 1px dashed var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.piece-num {
  flex-shrink: 0;
  background: var(--accent);
  color: white;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
  font-size: 14px;
}
.piece-name-input {
  flex: 1;
  min-width: 140px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg-soft);
  font-size: 16px;
  transition: all 0.15s ease;
}
.piece-name-input:focus {
  outline: none;
  border-color: var(--accent);
  background: white;
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.piece-subtotal {
  flex-shrink: 0;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg-soft);
  padding: 4px 10px;
  border-radius: 6px;
}
.piece-subtotal .num { color: var(--accent); font-size: 1.1em; }

/* ====== Criterion ====== */
.criterion {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.criterion:last-child { border-bottom: none; }
.criterion-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.criterion-name {
  display: flex;
  align-items: baseline;
  gap: 4px;
  font-weight: 500;
  font-size: 15px;
}
.criterion-name .zh-part { color: var(--text-primary); font-weight: 600; }
.criterion-name .en-part {
  font-size: 0.85em;
  color: var(--text-tertiary);
  font-weight: 400;
}
.lang-en .criterion-name .en-part { color: var(--text-primary); font-weight: 500; }

.score-row {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.score-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid var(--c, #ccc);
  background: white;
  color: var(--c, #ccc);
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.16s ease;
  flex-shrink: 0;
}
.score-btn:active { transform: scale(0.92); }
.score-btn.selected {
  background: var(--c);
  color: white;
  transform: scale(1.08);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
}

/* ====== Detail Panel ====== */
.detail-panel {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.25s ease, margin 0.25s ease, padding 0.25s ease;
  margin-top: 0;
  padding: 0 12px;
  border-radius: 8px;
  background: var(--bg-soft);
  border-left: 4px solid var(--c, var(--accent));
}
.detail-panel.expanded {
  max-height: 320px;
  margin-top: 8px;
  padding: 10px 12px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.detail-panel .band-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 13px;
  flex-wrap: wrap;
}
.detail-panel .band-num {
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  color: var(--c, var(--accent));
  font-size: 18px;
}
.detail-panel .band-name { font-weight: 600; color: var(--text-primary); }
.detail-panel .band-name .en-part { font-size: 0.85em; opacity: 0.7; margin-left: 3px; font-weight: 500; }
.detail-panel .band-range {
  font-size: 12px;
  color: var(--text-tertiary);
  background: white;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.detail-panel .band-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
}
.detail-panel .band-desc .desc-zh { display: block; }
.detail-panel .band-desc .desc-en {
  display: block;
  font-size: 0.92em;
  color: var(--text-tertiary);
  font-style: italic;
  margin-top: 2px;
}
.lang-en .detail-panel .band-name .en-part { opacity: 1; }
.lang-en .detail-panel .band-desc .desc-en { color: var(--text-secondary); font-style: normal; }
.lang-en .detail-panel .band-desc .desc-zh { display: none; }
.lang-en .detail-panel .band-desc .desc-en { font-size: 1em; margin-top: 0; }

/* ====== Comment Input ====== */
.comment-input {
  width: 100%;
  margin-top: 8px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg-soft);
  color: var(--text-primary);
  font-size: 16px;
  font-family: inherit;
  transition: all 0.15s ease;
}
.comment-input:focus {
  outline: none;
  border-color: var(--accent);
  background: white;
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.comment-input::placeholder {
  color: var(--text-tertiary);
  font-size: 13px;
}

/* ====== Extra Section (Perf as Whole / Tech Tests) ====== */
.extra-card {
  background: linear-gradient(135deg, #FFFBF2 0%, #FFF8E8 100%);
  border: 1px solid var(--accent-soft);
}
.extra-card .card-title { color: var(--accent); }

/* ====== Summary ====== */
.summary-card {
  background: linear-gradient(135deg, #1A1A1A 0%, #2A2620 100%);
  color: white;
  border: none;
  box-shadow: var(--shadow-lg);
}
.summary-card .card-title { color: white; }
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.summary-cell {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 10px 12px;
  text-align: center;
}
.summary-cell .label {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.6);
  font-weight: 500;
  margin-bottom: 4px;
}
.summary-cell .label .en-part { opacity: 0.8; margin-left: 2px; }
.summary-cell .value {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 600;
  color: white;
}
.summary-cell .value .denom { color: rgba(255, 255, 255, 0.5); font-size: 0.75em; }

.summary-total-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding-top: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.15);
}
.summary-total {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.85);
}
.summary-total .grand-num {
  font-size: 28px;
  font-weight: 700;
  color: white;
  margin: 0 4px;
}
.summary-total .grand-denom { color: rgba(255, 255, 255, 0.55); font-size: 0.85em; }

.result-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 999px;
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
  font-size: 15px;
  background: var(--pill-bg, #555);
  color: white;
  border: 2px solid var(--pill-border, transparent);
}
.result-pill .en-part { font-size: 0.85em; opacity: 0.85; margin-left: 4px; font-weight: 500; }

.action-buttons {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.action-btn {
  flex: 1;
  min-width: 140px;
  padding: 11px 14px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.18s ease;
  border: 1px solid transparent;
}
.action-btn .icon { font-size: 16px; }
.action-btn .en-part { font-size: 0.85em; opacity: 0.85; margin-left: 3px; }
.btn-primary {
  background: var(--accent);
  color: white;
}
.btn-primary:active { transform: scale(0.97); }
.btn-secondary {
  background: white;
  color: var(--text-primary);
  border-color: var(--border-strong);
}
.btn-secondary:active { transform: scale(0.97); }

/* ====== Sticky Summary (Criteria Page) ====== */
.criteria-sticky {
  position: sticky;
  top: 86px;
  z-index: 90;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: saturate(180%) blur(8px);
  -webkit-backdrop-filter: saturate(180%) blur(8px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-md);
}
.criteria-sticky-grid {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 12px;
}
.cs-cell {
  background: var(--bg-soft);
  border-radius: 6px;
  padding: 5px 9px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 60px;
}
.cs-cell .lbl { color: var(--text-tertiary); font-size: 10px; font-weight: 500; }
.cs-cell .val { font-family: 'Noto Serif SC', serif; font-weight: 600; color: var(--text-primary); }
.cs-cell .val .den { color: var(--text-tertiary); font-size: 0.85em; }
.cs-pill {
  margin-left: auto;
  padding: 6px 12px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 12px;
  color: white;
  background: var(--pill-bg, #999);
}

/* ====== Criteria Reference Page ====== */
.criteria-section {
  margin-bottom: 18px;
}
.criteria-section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  margin: 14px 0 8px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--accent);
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.criteria-section-title .en-part {
  font-size: 0.78em;
  color: var(--text-tertiary);
  font-weight: 500;
  font-family: 'Noto Sans SC', sans-serif;
}
.criteria-subsection {
  margin-bottom: 16px;
}
.criteria-subsection-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 8px;
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.criteria-subsection-title .en-part {
  font-size: 0.85em;
  color: var(--text-tertiary);
  font-weight: 400;
  font-family: 'Noto Sans SC', sans-serif;
}
.criteria-subsection-title .extra-info {
  font-size: 0.78em;
  color: var(--text-tertiary);
  margin-left: auto;
  font-weight: 400;
  font-family: 'Noto Sans SC', sans-serif;
}

.band-row {
  display: block;
  padding: 10px 12px;
  margin-bottom: 6px;
  background: white;
  border: 1px solid var(--border);
  border-left: 4px solid var(--c, #ccc);
  border-radius: 8px;
  transition: all 0.18s ease;
}
.band-row.has-selection {
  border-color: var(--c);
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 8%, white) 0%, white 50%);
  box-shadow: 0 1px 6px color-mix(in srgb, var(--c) 25%, transparent);
}
.band-row-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.band-row .b-num {
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  color: var(--c);
  font-size: 18px;
  min-width: 18px;
}
.band-row .b-name {
  font-weight: 600;
  color: var(--text-primary);
  font-size: 14px;
}
.band-row .b-name .en-part {
  font-size: 0.85em;
  color: var(--text-tertiary);
  margin-left: 3px;
  font-weight: 500;
}
.band-row .b-range {
  font-size: 11px;
  color: var(--text-tertiary);
  background: var(--bg-soft);
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.band-row .piece-tags {
  margin-left: auto;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.band-row .piece-tag {
  background: var(--c);
  color: white;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Noto Serif SC', serif;
}
.band-row .b-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
}
.band-row .b-desc .desc-en {
  display: block;
  font-size: 0.92em;
  color: var(--text-tertiary);
  font-style: italic;
  margin-top: 2px;
}
.lang-en .band-row .b-desc .desc-en { color: var(--text-secondary); font-style: normal; }
.lang-en .band-row .b-desc .desc-zh { display: none; }
.lang-en .band-row .b-desc .desc-en { font-size: 1em; margin-top: 0; }
.lang-en .band-row .b-name .en-part { color: var(--text-primary); }

/* Result band table (Section C) */
.result-band-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px;
  margin-bottom: 6px;
  background: white;
  border: 1px solid var(--border);
  border-left: 4px solid var(--c);
  border-radius: 8px;
  transition: all 0.2s ease;
}
.result-band-row.is-current {
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 10%, white), white 60%);
  border-color: var(--c);
  box-shadow: 0 2px 8px color-mix(in srgb, var(--c) 30%, transparent);
}
.result-band-row .rb-range {
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  color: var(--c);
  font-size: 16px;
  min-width: 80px;
}
.result-band-row .rb-pct {
  font-size: 12px;
  color: var(--text-tertiary);
  background: var(--bg-soft);
  padding: 2px 8px;
  border-radius: 4px;
}
.result-band-row .rb-name {
  font-weight: 600;
  color: var(--text-primary);
  font-size: 14px;
}
.result-band-row .rb-name .en-part {
  font-size: 0.85em;
  color: var(--text-tertiary);
  margin-left: 3px;
}

.print-area {

/* ============================================================
   UTILITIES
============================================================ */

function t(obj) {
  if (!obj) return '';
  return state.lang === 'en' ? (obj.en || obj.zh || '') : (obj.zh || obj.en || '');
}

function getModeData() { return CRITERIA_DATA[state.mode]; }

function getResultBand(pct) {
  for (const b of RESULT_BANDS) {
    if (pct >= b.threshold) return b;
  }
  return RESULT_BANDS[RESULT_BANDS.length - 1];
}

function calcPieceTotal(pieceObj, criteriaIds) {
  let total = 0;
  criteriaIds.forEach(id => { total += pieceObj.scores[id] || 0; });
  return total;
}

function calcExtraTotal(extraObj, ids) {
  let total = 0;
  ids.forEach(id => { total += extraObj.scores[id] || 0; });
  return total;
}

function calcGrandTotal() {
  const md = getModeData();
  const st = state[state.mode];
  const criteriaIds = md.pieces.criteria.map(c => c.id);
  const extraIds = md.extra.criteria.map(c => c.id);
  let total = 0;
  st.pieces.forEach(p => { total += calcPieceTotal(p, criteriaIds); });
  total += calcExtraTotal(st.extra, extraIds);
  return { total, max: md.grandTotal };
}

  const md = getModeData();

function renderPieceCard(idx, md) {
  const piece = state[state.mode].pieces[idx];
  const pieceTotal = calcPieceTotal(piece, md.pieces.criteria.map(c => c.id));
  const pieceLabelZh = ['一', '二', '三', '四'][idx] || (idx + 1);

             value="${escapeAttr(piece.name)}">

  return html;

function renderExtraCard(md) {
  const st = state[state.mode];

function renderCriterion(criterion, score, comment, scope) {
  const cId = criterion.id;
  let html = `<div class="criterion" data-criterion-id="${cId}" data-scope="${scope}">
    <div class="criterion-head">
      <div class="criterion-name">
        <span class="zh-part">${criterion.zh}</span><span class="en-part">${criterion.en}</span>
      </div>
      <div class="score-row">`;

  for (let s = 5; s >= 1; s--) {
    const color = SCORE_COLORS[s];
    const selected = (score === s) ? 'selected' : '';
    html += `<button class="score-btn ${selected}" data-score="${s}" style="--c:${color}">${s}</button>`;
  }

  html += `</div>
    </div>`;

  // Detail panel
  const band = criterion.bands.find(b => b.score === score);
  if (band) {
    const color = SCORE_COLORS[score];
    html += `<div class="detail-panel expanded" style="--c:${color}">
      <div class="band-line">
        <span class="band-num">${score}</span>
        <span class="band-name"><span class="zh-part">${BAND_NAMES[score].zh}</span><span class="en-part">${BAND_NAMES[score].en}</span></span>
        ${band.range ? `<span class="band-range">${band.range}</span>` : ''}
      </div>
      <div class="band-desc">
        <span class="desc-zh">${band.zh}</span>
        <span class="desc-en">${band.en}</span>
      </div>
    </div>`;
  } else {
    html += `<div class="detail-panel" style="--c:${SCORE_COLORS[3]}"></div>`;
  }

  // Comment input
  const phZh = `評語（可選）`;
  const phEn = `Comments (optional)`;
  const placeholder = state.lang === 'en' ? phEn : `${phZh} ${phEn}`;
  html += `<input type="text" class="comment-input" data-criterion-id="${cId}" data-scope="${scope}"
           placeholder="${escapeAttr(placeholder)}" value="${escapeAttr(comment || '')}">`;

  html += `</div>`;
  return html;
}

function attachScoringListeners() {
  // Use event delegation — a single listener per event type on the document.
  // This avoids duplicate-listener bugs when criterion elements are replaced.

  // Score buttons (delegated click)
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.score-btn');
    if (!btn) return;
    handleScoreClick(btn);
  });

  // Comment inputs (delegated input)
  document.addEventListener('input', (e) => {
    const input = e.target;
    if (input.classList.contains('comment-input')) {
      const cId = input.dataset.criterionId;
      const scope = input.dataset.scope;
      const scopeMatch = scope.match(/^piece-(\d+)$/);
      const value = input.value;
      if (scopeMatch) {
        const idx = parseInt(scopeMatch[1], 10);
        state[state.mode].pieces[idx].comments[cId] = value;
      } else {
        state[state.mode].extra.comments[cId] = value;
      }
      return;
    }
    if (input.classList.contains('piece-name-input')) {
      const idx = parseInt(input.dataset.pieceIdx, 10);
      state[state.mode].pieces[idx].name = input.value;
      return;
    }
    if (input.classList.contains('info-input')) {
      state.info[input.dataset.field] = input.value;
    }
  });
}

function handleScoreClick(btn) {
  const scoreVal = parseInt(btn.dataset.score, 10);
  const critEl = btn.closest('.criterion');
  if (!critEl) return;
  const cId = critEl.dataset.criterionId;
  const scope = critEl.dataset.scope;
  const scopeMatch = scope.match(/^piece-(\d+)$/);
  const md = getModeData();

  // Get current score
  let currentScore;
  if (scopeMatch) {
    const idx = parseInt(scopeMatch[1], 10);
    currentScore = state[state.mode].pieces[idx].scores[cId];
  } else {
    currentScore = state[state.mode].extra.scores[cId];
  }

  const newScore = (currentScore === scoreVal) ? 0 : scoreVal;

  // Update state
  if (scopeMatch) {
    const idx = parseInt(scopeMatch[1], 10);
    state[state.mode].pieces[idx].scores[cId] = newScore;
  } else {
    state[state.mode].extra.scores[cId] = newScore;
  }

  // Re-render just this criterion
  const criterionData = (scope.startsWith('piece-'))
    ? md.pieces.criteria.find(c => c.id === cId)
    : md.extra.criteria.find(c => c.id === cId);

  const comment = scopeMatch
    ? state[state.mode].pieces[parseInt(scopeMatch[1], 10)].comments[cId]
    : state[state.mode].extra.comments[cId];

  // Preserve focus on the button (for keyboard accessibility)
  const focusedScore = scoreVal;
  const wasDeselecting = (currentScore === scoreVal);

  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = renderCriterion(criterionData, newScore, comment, scope);
  const newCriterion = tempDiv.firstElementChild;
  critEl.replaceWith(newCriterion);

  // If we deselected, focus moves away naturally. If we selected a different score, refocus on the new button.
  if (!wasDeselecting) {
    const newBtn = newCriterion.querySelector(`.score-btn[data-score="${focusedScore}"]`);
    if (newBtn) newBtn.focus();
  }

  renderSummary();
  updatePieceSubtotals();
  renderCriteriaSticky();
}

function updatePieceSubtotals() {
  const md = getModeData();
  const ids = md.pieces.criteria.map(c => c.id);
  document.querySelectorAll('.piece-card').forEach((card, i) => {
    const piece = state[state.mode].pieces[i];
    const total = calcPieceTotal(piece, ids);
    const numEl = card.querySelector('.piece-subtotal .num');
    if (numEl) numEl.textContent = total;
  });

  // Extra subtotal
  const extraIds = md.extra.criteria.map(c => c.id);
  const extraTotal = calcExtraTotal(state[state.mode].extra, extraIds);
  const extraCard = document.querySelector('.extra-card');
  if (extraCard) {
    const numEl = extraCard.querySelector('.piece-subtotal .num');
    if (numEl) numEl.textContent = extraTotal;
  }
}

  </div>`;
  cellsHtml += `<div class="cs-cell">
    <div class="lbl"><span class="zh-part">總分</span><span class="en-part">Total</span></div>
    <div class="val">${total}<span class="den">/${max}</span></div>
  </div>`;

  const bandLabel = band
    ? (state.lang === 'zh' ? `${band.zh} ${band.en}` : band.en)
    : (state.lang === 'en' ? 'Not Scored' : '未評分 Not Scored');
  const bandBg = band ? band.color : '#999';

  const html = `<div class="criteria-sticky-grid">${cellsHtml}
    <div class="cs-pill" style="--pill-bg:${bandBg}">${bandLabel}</div>
  </div>`;

  document.getElementById('criteria-sticky').innerHTML = html;
}

function renderCriteriaContent() {
  const md = getModeData();
  let html = '';

  // Section A: Pieces Criteria
  html += `<div class="criteria-section">
    <h3 class="criteria-section-title">
      <span class="zh-part">A. 曲目評分準則</span><span class="en-part">Section A: Pieces Marking Criteria</span>
    </h3>`;

  md.pieces.criteria.forEach(c => {
    html += renderCriterionReference(c, 'pieces');
  });
  html += `</div>`;

  // Section B: Extra (Performance as Whole / Tech Tests)
  const extraTitle = state.mode === 'performance'
    ? 'B. 整體演奏表現 / Performance as a Whole'
    : 'B. 技術測試 / Technical Tests';
  const extraTitleParts = state.mode === 'performance'
    ? { zh: 'B. 整體演奏表現', en: 'Section B: Performance as a Whole' }
    : { zh: 'B. 技術測試', en: 'Section B: Technical Tests' };

  html += `<div class="criteria-section">
    <h3 class="criteria-section-title">
      <span class="zh-part">${extraTitleParts.zh}</span><span class="en-part">${extraTitleParts.en}</span>
    </h3>`;

  md.extra.criteria.forEach(c => {
    html += renderCriterionReference(c, 'extra');
  });
  html += `</div>`;

  // Section C: Overall Result Bands
  html += `<div class="criteria-section">
    <h3 class="criteria-section-title">
      <span class="zh-part">C. 總成績等級</span><span class="en-part">Section C: Overall Result Bands</span>
    </h3>`;

  const { total, max } = calcGrandTotal();
  const pct = max > 0 ? total / max : 0;
  const currentBand = total === 0 ? null : getResultBand(pct);

  RESULT_BANDS.forEach(b => {
    const isCurrent = currentBand && currentBand.id === b.id;
    const currentTag = isCurrent
      ? `<span class="rb-current-tag"><span class="zh-part">目前</span><span class="en-part">Current</span></span>`
      : '';
    html += `<div class="result-band-row ${isCurrent ? 'is-current' : ''}" style="--c:${b.color}">
      <span class="rb-range">${b.range}</span>
      <span class="rb-pct">${b.pct}</span>
      <span class="rb-name"><span class="zh-part">${b.zh}</span><span class="en-part">${b.en}</span></span>
      ${currentTag}
    </div>`;
  });

  html += `</div>`;

  document.getElementById('criteria-content').innerHTML = html;
}

function renderCriterionReference(criterion, scope) {
  const md = getModeData();
  let html = `<div class="criteria-subsection">
    <div class="criteria-subsection-title">
      <span class="zh-part">${criterion.zh}</span><span class="en-part">${criterion.en}</span>`;
  if (criterion.max) {
    html += `<span class="extra-info">(max ${criterion.max}, pass ${criterion.pass})</span>`;
  }
  html += `</div>`;

  // For each band, find which pieces have selected it
  criterion.bands.forEach(band => {
    const color = SCORE_COLORS[band.score];
    let tagsHtml = '';

    if (scope === 'pieces') {
      // Show piece tags
      for (let i = 0; i < md.pieces.count; i++) {
        const piece = state[state.mode].pieces[i];
        if (piece.scores[criterion.id] === band.score) {
          tagsHtml += `<span class="piece-tag">P${i + 1}</span>`;
        }
      }
    } else {
      // Show extra tag
      const extraScore = state[state.mode].extra.scores[criterion.id];
      const hasMatch = (extraScore === band.score);
      if (hasMatch) {
        const tagText = state.mode === 'performance' ? '★' : '★';
        tagsHtml += `<span class="piece-tag">${tagText}</span>`;
      }
    }

    const hasSelection = tagsHtml !== '';
    const selectedClass = hasSelection ? 'has-selection' : '';

    html += `<div class="band-row ${selectedClass}" style="--c:${color}">
      <div class="band-row-top">
        <span class="b-num">${band.score}</span>
        <span class="b-name"><span class="zh-part">${BAND_NAMES[band.score].zh}</span><span class="en-part">${BAND_NAMES[band.score].en}</span></span>
        ${band.range ? `<span class="b-range">${band.range}</span>` : ''}
        <span class="piece-tags">${tagsHtml}</span>
      </div>
      <div class="b-desc">
        <span class="desc-zh">${band.zh}</span>
        <span class="desc-en">${band.en}</span>
      </div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

/* ============================================================
   OUTPUT TEXT GENERATION
============================================================ */

function generateOutputText() {
  const md = getModeData();
  const isZh = state.lang === 'zh';
  // Lb returns bilingual in ZH mode, English-only in EN mode
  const Lb = (zh, en) => isZh ? `${zh} ${en}` : en;
  const Lbs = (zh, en) => isZh ? `${zh} / ${en}` : en;  // slash-separated
  const Lp = (zh, en) => isZh ? `${zh} | ${en}` : en;  // pipe-separated (for info rows)

  const sep = '━━━━━━━━━━━━━━━━━━';
  let out = '';

  // Header
  out += `🎻 ABRSM ${Lb(md.name.zh, md.name.en)} ${Lbs('評分表', 'Scoring Sheet')}\n`;
  out += sep + '\n';
  out += `${Lp('學生', 'Student')}: ${state.info.student || '___'}\n`;
  out += `${Lp('日期', 'Date')}: ${state.info.date || '___'}\n`;
  out += `${Lp('級別', 'Grade')}: ${state.info.grade || '___'}\n`;
  out += `${Lp('教師', 'Teacher')}: ${state.info.teacher || '___'}\n`;
  out += sep + '\n\n';

  const pieceNumsZh = ['1️⃣', '2️⃣', '3️⃣', '4️⃣'];
  const pieceLabelsZh = ['曲目一', '曲目二', '曲目三', '曲目四'];

  // Pieces
  for (let i = 0; i < md.pieces.count; i++) {
    const piece = state[state.mode].pieces[i];
    const num = pieceNumsZh[i];
    const label = isZh ? pieceLabelsZh[i] : `Piece ${i + 1}`;
    const name = piece.name || (isZh ? '（未填）' : '(untitled)');
    out += `${num} ${label} / Piece ${i + 1}: ${name}\n`;

    md.pieces.criteria.forEach(c => {
      const score = piece.scores[c.id];
      const comment = piece.comments[c.id] || '';
      out += `  ${Lb(c.zh, c.en)}`;
      if (score > 0) {
        const bandObj = BAND_NAMES[score];
        const bandName = isZh ? `${bandObj.zh} ${bandObj.en}` : bandObj.en;
        out += `: ${score}${isZh ? '分' : ''} ${bandName}`;
        if (comment) out += ` — ${comment}`;
      } else {
        out += `: ${isZh ? '未評分 Not Scored' : 'Not Scored'}`;
      }
      out += '\n';
    });

    const ids = md.pieces.criteria.map(c => c.id);
    const sub = calcPieceTotal(piece, ids);
    out += `  ${Lb('小計', 'Subtotal')}: ${sub}/25\n\n`;
  }

  // Extra section
  const extraTitleFull = isZh
    ? `${md.extra.symbol} ${md.extra.title.zh} / ${md.extra.title.en}`
    : `${md.extra.symbol} ${md.extra.title.en}`;
  out += extraTitleFull + '\n';

  md.extra.criteria.forEach(c => {
    const score = state[state.mode].extra.scores[c.id];
    const comment = state[state.mode].extra.comments[c.id] || '';
    let lineLabel = Lb(c.zh, c.en);
    if (c.max) {
      lineLabel += ` (max ${c.max}, pass ${c.pass})`;
    }
    out += `  ${lineLabel}`;
    if (score > 0) {
      const bandObj = BAND_NAMES[score];
      const bandName = isZh ? `${bandObj.zh} ${bandObj.en}` : bandObj.en;
      out += `: ${score}${isZh ? '分' : ''} ${bandName}`;
      if (comment) out += ` — ${comment}`;
    } else {
      out += `: ${isZh ? '未評分 Not Scored' : 'Not Scored'}`;
    }
    out += '\n';
  });

  const extraIds = md.extra.criteria.map(c => c.id);
  const extraTotal = calcExtraTotal(state[state.mode].extra, extraIds);
  out += `  ${Lb('小計', 'Subtotal')}: ${extraTotal}/15\n\n`;

  // Total
  const { total, max } = calcGrandTotal();
  const pct = max > 0 ? total / max : 0;
  const band = total === 0 ? null : getResultBand(pct);
  const bandLabel = band
    ? (isZh ? `${band.zh} ${band.en}` : band.en)
    : (isZh ? '未評分 Not Scored' : 'Not Scored');

  out += sep + '\n';
  out += `${Lb('總分', 'Grand Total')}: ${total}/${max}\n`;
  out += `${Lb('等級', 'Result')}: ${bandLabel}\n`;
  out += sep + '\n';

  return out;
}

function generatePdfHtml() {
  const md = getModeData();
  const isZh = state.lang === 'zh';
  // Lb returns bilingual in ZH mode, English-only in EN mode
  const Lb = (zh, en) => isZh ? `${zh} ${en}` : en;
  const Lbs = (zh, en) => isZh ? `${zh} / ${en}` : en;
  const Lp = (zh, en) => isZh ? `${zh} | ${en}` : en;
  const Lne = (zh, en) => isZh ? `${zh} ${en}` : en;  // for "not scored" etc

  let html = `<div class="pa-title">🎻 ABRSM ${Lb(md.name.zh, md.name.en)} ${Lbs('評分表', 'Scoring Sheet')}</div>`;
  html += `<div class="pa-line">${Lp('學生', 'Student')}: ${escapeHtml(state.info.student) || '___'}</div>`;
  html += `<div class="pa-line">${Lp('日期', 'Date')}: ${escapeHtml(state.info.date) || '___'}</div>`;
  html += `<div class="pa-line">${Lp('級別', 'Grade')}: ${escapeHtml(state.info.grade) || '___'}</div>`;
  html += `<div class="pa-line">${Lp('教師', 'Teacher')}: ${escapeHtml(state.info.teacher) || '___'}</div>`;
  html += `<div class="pa-divider"></div>`;

  const pieceNumsZh = ['1️⃣', '2️⃣', '3️⃣', '4️⃣'];
  const pieceLabelsZh = ['曲目一', '曲目二', '曲目三', '曲目四'];

  for (let i = 0; i < md.pieces.count; i++) {
    const piece = state[state.mode].pieces[i];
    const num = pieceNumsZh[i];
    const label = isZh ? pieceLabelsZh[i] : `Piece ${i + 1}`;
    const name = piece.name || (isZh ? '（未填）' : '(untitled)');
    html += `<div class="pa-section">${num} ${label} / Piece ${i + 1}: ${escapeHtml(name)}</div>`;

    md.pieces.criteria.forEach(c => {
      const score = piece.scores[c.id];
      const comment = piece.comments[c.id] || '';
      let lineLabel = Lb(c.zh, c.en);
      let lineContent;
      if (score > 0) {
        const bandObj = BAND_NAMES[score];
        const bandName = isZh ? `${bandObj.zh} ${bandObj.en}` : bandObj.en;
        lineContent = `${score}${isZh ? '分' : ''} ${bandName}`;
        if (comment) lineContent += ` — ${escapeHtml(comment)}`;
      } else {
        lineContent = Lne('未評分', 'Not Scored');
      }
      html += `<div class="pa-line">${lineLabel}: ${lineContent}</div>`;
    });

    const ids = md.pieces.criteria.map(c => c.id);
    const sub = calcPieceTotal(piece, ids);
    html += `<div class="pa-line"><strong>${Lb('小計', 'Subtotal')}: ${sub}/25</strong></div>`;
  }

  // Extra section
  const extraTitle = isZh
    ? `${md.extra.symbol} ${md.extra.title.zh} / ${md.extra.title.en}`
    : `${md.extra.symbol} ${md.extra.title.en}`;
  html += `<div class="pa-section">${extraTitle}</div>`;

  md.extra.criteria.forEach(c => {
    const score = state[state.mode].extra.scores[c.id];
    const comment = state[state.mode].extra.comments[c.id] || '';
    let lineLabel = Lb(c.zh, c.en);
    if (c.max) lineLabel += ` (max ${c.max}, pass ${c.pass})`;
    let lineContent;
    if (score > 0) {
      const bandObj = BAND_NAMES[score];
      const bandName = isZh ? `${bandObj.zh} ${bandObj.en}` : bandObj.en;
      lineContent = `${score}${isZh ? '分' : ''} ${bandName}`;
      if (comment) lineContent += ` — ${escapeHtml(comment)}`;
    } else {
      lineContent = Lne('未評分', 'Not Scored');
    }
    html += `<div class="pa-line">${lineLabel}: ${lineContent}</div>`;
  });

  const extraIds = md.extra.criteria.map(c => c.id);
  const extraTotal = calcExtraTotal(state[state.mode].extra, extraIds);
  html += `<div class="pa-line"><strong>${Lb('小計', 'Subtotal')}: ${extraTotal}/15</strong></div>`;

  const { total, max } = calcGrandTotal();
  const pct = max > 0 ? total / max : 0;
  const band = total === 0 ? null : getResultBand(pct);
  const bandLabel = band
    ? (isZh ? `${band.zh} ${band.en}` : band.en)
    : (isZh ? '未評分 Not Scored' : 'Not Scored');

  html += `<div class="pa-total"><strong>${Lb('總分', 'Grand Total')}: ${total}/${max}</strong></div>`;
  html += `<div class="pa-total"><strong>${Lb('等級', 'Result')}: ${bandLabel}</strong></div>`;

  return html;
}

/* ============================================================
   MODALS
============================================================ */

function openCopyModal() {
  const text = generateOutputText();
  const ta = document.getElementById('copy-textarea');
  ta.value = text;
  document.getElementById('copy-modal').classList.add('open');

  // Try auto-copy
  setTimeout(() => {
    ta.focus();
    ta.select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
  }, 50);
}

function openPdfModal() {
  const html = generatePdfHtml();
  document.getElementById('pdf-content').innerHTML = html;
  document.getElementById('pdf-modal').classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

/* ============================================================
   LANGUAGE TOGGLE
============================================================ */

function applyLang(lang) {
  state.lang = lang;
  document.body.classList.toggle('lang-zh', lang === 'zh');
  document.body.classList.toggle('lang-en', lang === 'en');
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  renderAll();
}

/* ============================================================
   MODE / SUB SWITCHING
============================================================ */

function applyMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  renderAll();
}

function applySub(sub) {
  state.sub = sub;
  document.querySelectorAll('.sub-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.sub === sub);
  });
  document.getElementById('page-scoring').classList.toggle('active', sub === 'scoring');
  document.getElementById('page-criteria').classList.toggle('active', sub === 'criteria');
  if (sub === 'criteria') renderCriteriaPage();
}

function renderAll() {
  renderScoring();
  if (state.sub === 'criteria') renderCriteriaPage();
}

/* ============================================================
   HELPERS
============================================================ */

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escapeAttr(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ============================================================
   INIT
============================================================ */

function init() {
  // Mode tabs
  document.querySelectorAll('.mode-tab').forEach(t => {
    t.addEventListener('click', () => applyMode(t.dataset.mode));
  });

  // Sub tabs
  document.querySelectorAll('.sub-tab').forEach(t => {
    t.addEventListener('click', () => applySub(t.dataset.sub));
  });

  // Lang buttons
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.addEventListener('click', () => applyLang(b.dataset.lang));
  });

  // Modal close buttons
  document.querySelectorAll('[data-close]').forEach(b => {
    b.addEventListener('click', () => closeModal(b.dataset.close));
  });

  // Click outside modal to close
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('open');
    });
  });

  // Print button
  document.getElementById('print-btn').addEventListener('click', () => {
    const html = generatePdfHtml();
    const pa = document.getElementById('print-area');
    pa.innerHTML = html;
    // Close modal so it doesn't interfere
    document.getElementById('pdf-modal').classList.remove('open');
    // Show print area (it's display:none by default)
    pa.style.display = 'block';
    // Small delay to ensure DOM updated
    setTimeout(function() {
      window.print();
      // Restore after print dialog
      setTimeout(function() {
        pa.style.display = '';
      }, 500);
    }, 100);
  });

  // Initial render
  attachScoringListeners();
  renderAll();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
